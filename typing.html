<!doctype html><html lang="ko"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>타자 올림픽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;700;800&family=Nanum+Gothic+Coding:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 타자 올림픽 — 학생 화면, 그리고 ?t=1 이면 교사(교실 앞) 화면. 판정과 시계는 서버가 갖는다 */
:root{
  color-scheme:light;
  --wall:#ffffff; --wall-2:#f6f6f7; --wall-line:#dcdce1;
  --chalk:#16171a; --chalk-dim:#63646b; --mark:#8a5a00; --gold:#f0c75e;
  --win:#1f7a3d; --lose:#c62828; --wait:#2d5f9a;
  --m-gold:#d9a514; --m-silver:#9aa1a9; --m-bronze:#b26a35;
  --s1:4px; --s2:10px; --s3:16px; --s4:24px; --s5:36px;
  --type-font:"Nanum Gothic Coding",monospace; --type-size:24px; --type-pad:12px 16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--wall);color:var(--chalk);font-family:"Gothic A1",sans-serif;font-size:15px}
header{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap;padding:var(--s3) var(--s4);border-bottom:1px solid var(--wall-line)}
header .hdr-info{display:flex;gap:var(--s4);align-items:baseline;font-variant-numeric:tabular-nums;margin-right:auto}
header .hdr-info .ttl{font-size:16px;font-weight:800}
header .hdr-info b{font-size:22px;font-weight:800} header .hdr-info span{font-size:12px;color:var(--chalk-dim);margin-left:4px}
header h1{font-size:18px;font-weight:800;margin:0 var(--s3) 0 0}
header label{font-size:13px;color:var(--chalk-dim);display:flex;gap:6px;align-items:center}
header input{width:64px;font:inherit;padding:4px 6px;border:1px solid var(--wall-line);border-radius:6px}
.layout{display:grid;grid-template-columns:1fr 300px;min-height:calc(100vh - 62px)}
main{padding:var(--s4);padding-bottom:300px;min-width:0}   /* 아래 고정 입력대에 가리지 않게 */
/* 입력대 — 모든 종목의 입력 칸은 경기 화면 아래쪽 가운데에 붙박는다 */
.dock{position:fixed;bottom:0;left:calc((100vw - 300px) / 2);transform:translateX(-50%);z-index:5;
  width:min(900px, calc(100vw - 300px - 48px));background:var(--wall);padding:var(--s3) 0 var(--s2);
  box-shadow:0 -14px 18px -12px rgba(0,0,0,.12)}
.dock .toast{margin-top:6px}
aside{border-left:1px solid var(--wall-line);background:var(--wall-2);padding:var(--s4) var(--s3)}
aside h2{font-size:13px;color:var(--chalk-dim);margin:0 0 var(--s2);font-weight:700}
h2.title{font-size:22px;font-weight:800;margin:0 0 var(--s1)}
.sub{color:var(--chalk-dim);margin:0 0 var(--s3)}
button{font:inherit;font-size:14px;padding:8px 14px;border:1px solid var(--wall-line);border-radius:8px;background:var(--wall);cursor:pointer}
button:hover{background:var(--wall-2)}
button.go{background:var(--chalk);color:var(--wall);border-color:var(--chalk);font-weight:700}
.row{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
ul.rules{margin:0 0 var(--s4);padding-left:20px;line-height:1.8}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
table.t{border-collapse:collapse;width:100%;margin:var(--s2) 0 var(--s3);font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:6px 10px;border-bottom:1px solid var(--wall-line);text-align:left}
table.t th{font-size:12px;color:var(--chalk-dim);font-weight:700}
tr.me td{background:#fff7dc}
tr.up td{font-weight:700}

/* 종목 진행표 · 메달판 */
.evs{display:grid;gap:4px;margin-bottom:var(--s4)}
.ev{font:inherit;font-size:13px;padding:6px 10px;border-radius:6px;color:var(--chalk-dim);text-align:left;background:none;border:1px solid transparent;cursor:pointer}
.ev:hover{background:var(--wall);border-color:var(--wall-line)}
.ev.now{background:var(--wall);color:var(--chalk);font-weight:700;border:1px solid var(--wall-line)}
.ev.done{color:var(--chalk)}
.medal{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:#fff;font-size:12px;font-weight:800}
.medal.g{background:var(--m-gold)} .medal.s{background:var(--m-silver)} .medal.b{background:var(--m-bronze)}
.tally td:nth-child(n+2){text-align:center;width:34px}

/* 시상대 */
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);align-items:end;max-width:560px;margin:var(--s4) 0}
.step{text-align:center}
.step .who{font-size:14px;margin-bottom:6px}
.step .who b{display:block;font-size:17px}
.step .block{border-radius:8px 8px 0 0;color:#fff;font-weight:800;font-size:28px;display:grid;place-items:center}
.step.p0 .block{height:130px;background:var(--m-gold)} .step.p1 .block{height:95px;background:var(--m-silver)} .step.p2 .block{height:70px;background:var(--m-bronze)}
.step.p0{order:2} .step.p1{order:1} .step.p2{order:3}

/* 경기 화면 */
.hud{display:flex;gap:var(--s4);margin-bottom:var(--s3);font-variant-numeric:tabular-nums}
.hud div b{display:block;font-size:26px;font-weight:800}
.hud div span{font-size:12px;color:var(--chalk-dim)}
.items{display:grid;gap:4px;margin-bottom:var(--s3)}
.item{display:grid;grid-template-columns:1fr auto;gap:var(--s2);align-items:center;padding:6px 10px;border:1px solid var(--wall-line);border-radius:8px;font-family:var(--type-font);font-size:16px}
.item.tried{grid-template-columns:44px 1fr auto}
.items.two{grid-template-columns:1fr 1fr;gap:4px 8px}
.items.two .item{font-size:15px;padding:4px 8px;min-height:34px}
.tries{font-family:"Gothic A1",sans-serif;font-size:12px;font-weight:800;text-align:center;border-radius:999px;padding:2px 0;color:var(--chalk-dim)}
.tries.hot{background:var(--wait);color:var(--wall)}
.sheet td.pm{white-space:nowrap}
.item .src{display:block;font-family:"Gothic A1",sans-serif;font-size:11px;color:var(--chalk-dim);margin-top:2px}
.item .st{font-family:"Gothic A1",sans-serif;font-size:12px;color:var(--chalk-dim);white-space:nowrap}
.item.on{border-color:var(--wait);background:#eef4fb}
.item.taken{opacity:.45;text-decoration:line-through}
.item.ours{opacity:.6;background:#eaf6ee;text-decoration:none}
.item.click{cursor:pointer} .item.click:hover{border-color:var(--chalk-dim)}
/* 1종목 우리 팀 상자 */
.teambox{border:1px solid var(--wall-line);border-radius:10px;padding:var(--s2) var(--s3);min-width:300px;margin-bottom:var(--s3)}
.tb-head{font-size:14px;margin-bottom:4px} .tb-head b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.tb-head span{color:var(--chalk-dim);font-size:13px}
.teambox table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.teambox th{font-size:11px;color:var(--chalk-dim);text-align:left;font-weight:700;padding:2px 6px}
.teambox td{padding:3px 6px;border-top:1px solid var(--wall-line)}
.teambox td:nth-child(n+2),.teambox th:nth-child(n+2){text-align:right;width:48px}
/* 1종목 카드 — 칸 크기가 고정이라 글자가 바뀌어도 아무것도 밀리지 않는다 */
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--s2);margin-bottom:var(--s3)}
.card{height:72px;display:grid;place-items:center;border:1px solid var(--wall-line);border-radius:10px;
  font-family:var(--type-font);font-size:22px;background:var(--wall);overflow:hidden;white-space:nowrap}
.card.on{border-color:var(--wait);background:#eef4fb}
.card.empty{border-style:dashed;background:var(--wall-2)}
.card.fresh{animation:fresh .5s ease-out}
@keyframes fresh{0%{background:#eaf6ee;transform:scale(.92)}100%{background:var(--wall);transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.card.fresh{animation:none}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:var(--s3)}
.chip{font-family:var(--type-font);font-size:18px;padding:6px 12px;border:1px solid var(--wall-line);border-radius:999px}
.chip.on{border-color:var(--wait);background:#eef4fb}
.chip.taken{background:#eaf6ee;color:var(--win);border-color:#bfe3ca}
mark{background:#fde7a6;border-bottom:2px solid var(--mark);color:inherit}
mark.gap{padding:0 3px}
.toast{min-height:22px;font-size:14px;font-weight:700;margin-top:var(--s2)}
.toast.bad{color:var(--lose)} .toast.good{color:var(--win)}
.toast.ready{color:var(--wait)}

/* 득점 배너 — 화면 위쪽 가운데에 크게 떴다가 사라진다 */
.pop{position:fixed;left:50%;top:90px;transform:translateX(-50%);z-index:10;pointer-events:none;white-space:nowrap;
  background:var(--chalk);color:var(--wall);border-radius:18px;padding:16px 44px;text-align:center;
  box-shadow:0 10px 36px rgba(0,0,0,.3);opacity:0}
.pop b{display:block;font-size:52px;line-height:1.15;font-weight:800;color:var(--gold)}
.pop span{font-size:20px;font-weight:700}
.pop.show{animation:pop 1.8s ease-out}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-10px) scale(.9)}10%{opacity:1;transform:translate(-50%,0) scale(1.05)}20%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.pop.show{animation:none;opacity:1}}


/* 타자 칸 — typing-lab 과 같은 겹침 */
.line{font-family:var(--type-font);font-size:var(--type-size);line-height:1.6;padding:var(--type-pad);border:2px solid transparent;border-radius:10px;
  white-space:pre-wrap;word-break:break-all;overflow-wrap:anywhere;letter-spacing:0;font-kerning:none;font-variant-ligatures:none;width:100%;margin:0}
.target{background:var(--wall-2);min-height:calc(var(--type-size)*1.6 + 28px)}
.target .ok{color:#a7a8ae} .target .bad{background:#fde3e3;color:var(--lose)} .target .cur{background:var(--gold);border-radius:3px}
.target .hint{color:var(--chalk-dim);font-family:"Gothic A1",sans-serif;font-size:15px}
.field{position:relative;margin-top:var(--s2)}
.ghost{position:absolute;inset:0;color:transparent;pointer-events:none}
.ghost .bad{text-decoration:underline wavy var(--lose);text-decoration-thickness:2px;text-underline-offset:7px;text-decoration-skip-ink:none}
textarea.line{display:block;position:relative;background:transparent;border-color:var(--wall-line);resize:none;overflow:hidden;outline:none;caret-color:var(--wait)}
textarea.line:focus{border-color:var(--wait)}

/* 표 편집 */
.tables{display:grid;gap:var(--s3)}
.tables .sub{margin-bottom:6px}
table.grid{border-collapse:collapse;font-family:var(--type-font);font-size:14px;width:100%;table-layout:fixed}
table.grid td{border:1px solid var(--wall-line);padding:0;height:34px}
table.grid input,table.grid textarea{display:block;width:100%;height:100%;border:0;padding:6px 8px;font:inherit;line-height:1.5;background:transparent;outline:none}
table.grid textarea{resize:none;overflow:hidden;height:54px}
table.grid td.num input{text-align:right}
table.grid input:focus,table.grid textarea:focus{background:#eef4fb;box-shadow:inset 0 0 0 2px var(--wait)}
table.grid td.diff{background:#fde7a6}
table.grid td.part{box-shadow:inset 0 0 0 2px #f0c24b}
mark.chg{background:#fde7a6;color:inherit;border-radius:2px;padding:0 1px} mark.chg.gap{display:inline-block;width:6px;height:1em;vertical-align:middle;background:#f0c24b}
table.grid.goal td.swap{box-shadow:inset 0 0 0 2px #7b4fd6}
.tables .how{font-weight:400;color:var(--chalk-dim)}
table.grid td.head{background:var(--wall-2);font-weight:700}
table.grid td.head.diff{background:#fde7a6}   /* 제목 칸도 다르면 노랗게 */
table.grid.goal td{padding:6px 8px;line-height:1.5} table.grid.goal td.num{text-align:right}

/* 팀 고르기 — 2행 3열 빈 칸 */
.lobby{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);margin-bottom:var(--s4)}
.slot{min-height:150px;border:2px solid var(--wall-line);border-radius:12px;padding:var(--s2) var(--s3);display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;cursor:pointer}
.slot.empty{border-style:dashed;background:var(--wall-2)}
.slot.mine{border-color:var(--wait)}
.slot-h{width:100%;font-weight:800;margin-bottom:4px} .slot-h span{font-weight:400;font-size:13px;color:var(--chalk-dim)}
.chip.pl{font-family:"Gothic A1",sans-serif;font-size:13px;padding:4px 10px;background:var(--wall)}
.chip.pl.me{border-color:var(--wait);background:#eef4fb;font-weight:700}
.chip.pl[draggable="true"]{cursor:grab}

/* 종목 결과 — 팀 순위 + 득점표(우리 팀 | MVP) */
.res-head{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3);flex-wrap:wrap}
.res-head .cd{font-size:14px;color:var(--chalk-dim)} .res-head .cd b{font-size:22px;color:var(--chalk);font-variant-numeric:tabular-nums}
.sheet{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4);align-items:start}
.sheet h3{font-size:15px;margin:var(--s3) 0 0}
.t small{color:var(--chalk-dim)}

/* 배점 배지 — 문장 끝 오른쪽 */
.pts{display:inline-block;font-family:"Gothic A1",sans-serif;font-size:12px;font-weight:800;line-height:1;padding:4px 8px;border-radius:999px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.pts.t0{background:#eceef1;color:#4a4d55} .pts.t1{background:#dbe8f8;color:#1d4f8f} .pts.t2{background:#eadff8;color:#5b2d9a}
.pts.late{box-shadow:inset 0 0 0 2px var(--m-gold)}
.pts.x2{background:var(--lose);color:#fff}
.card .pts{font-size:11px;padding:3px 6px}
.hud .late{align-self:center;font-weight:800;color:var(--mark)}

/* 팀 대 팀 카드 — 미리 보기와 결과가 같은 틀 */
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:var(--s3);align-items:start;margin:var(--s3) 0}
.vs-mid{align-self:center;font-size:30px;font-weight:800;color:var(--chalk-dim)}
.side{border:2px solid var(--wall-line);border-radius:12px;padding:var(--s2) var(--s3)}
.side.won{border-color:var(--win);background:#f3faf5}
.vs-h{display:flex;gap:8px;align-items:center;font-size:20px;font-weight:800}
.vs-h b{margin-left:auto;font-size:24px;font-variant-numeric:tabular-nums}
.vs-h .vs-sub{margin-left:auto}
.vs-sub{font-size:12px;font-weight:400;color:var(--chalk-dim)}
.tag{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--wall-2);color:var(--chalk-dim)}
.tag.win{background:var(--win);color:#fff} .tag.lose{background:var(--wall-line);color:var(--chalk)}
.medal.sm{width:18px;height:18px;font-size:10px;margin-right:2px}
.countdown{font-size:24px;font-weight:800;text-align:center;margin:var(--s4) 0 var(--s2);font-variant-numeric:tabular-nums}
[hidden]{display:none !important}
.tn{white-space:nowrap} .slot-h span.tn{font-weight:inherit;font-size:inherit;color:inherit}
.gate{max-width:560px}
.gate input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--wall-line);border-radius:8px;width:100%}
.gate label{display:block;font-size:13px;color:var(--chalk-dim);margin:var(--s3) 0 6px}
.pickrow{display:flex;gap:var(--s2);align-items:center;width:100%;text-align:left;margin-bottom:6px}
.pickrow.on{border-color:var(--wait);background:#eef4fb}
.pickrow .t{flex:1;font-weight:700}
.msg{min-height:22px;font-size:14px;margin-top:var(--s2);color:var(--chalk-dim)} .msg.bad{color:var(--lose)}
.teach-bar{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center;margin:var(--s3) 0;padding:var(--s2) var(--s3);background:#fff7dc;border:1px solid #ecd9a0;border-radius:10px}
.teach-bar b{margin-right:auto}
body:not(.teach) .teach-only{display:none !important}
.offline{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--lose);color:#fff;text-align:center;padding:6px;font-weight:700}
/* 단축키 안내 — 크게, 짧게 */
.keys{display:grid;gap:var(--s3);margin:var(--s3) 0 var(--s4)}
.key{display:grid;grid-template-columns:minmax(260px,auto) 1fr;gap:var(--s4);align-items:center;font-size:24px}
.key .what{font-weight:800}
kbd{display:inline-block;font-family:"Gothic A1",sans-serif;font-size:22px;font-weight:800;padding:6px 14px;border:2px solid var(--chalk);border-bottom-width:5px;border-radius:10px;background:var(--wall);margin:0 2px;line-height:1.2}
.plus{font-size:20px;color:var(--chalk-dim);margin:0 2px}
.practice{border:2px dashed var(--wall-line);border-radius:12px;padding:var(--s3);margin-top:var(--s3)}
.practice h3{margin:0 0 var(--s2);font-size:17px}
.practice textarea.line{border-color:var(--wall-line)}
.practice .ok{color:var(--win);font-weight:800}
.grp{border:1px solid var(--wall-line);border-radius:10px;padding:var(--s2) var(--s3);margin-bottom:var(--s3)}
.grp h3{margin:0 0 4px;font-size:16px}
.boards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--s3)}
</style>

<div class="offline" id="offline" hidden>연결이 끊겼습니다 — 다시 붙는 중입니다</div>
<header>
  <h1 id="ttl">타자 올림픽</h1>
  <div class="hdr-info" id="hdrInfo"></div>
  <span id="myname" class="sub" style="margin:0"></span>
</header>
<div class="layout">
  <main id="stage"></main>
  <aside id="board"></aside>
</div>
<div class="pop" id="pop"></div>

<script>
/* ───────── 자모 · 판정 ───────── */
const CHO  = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const JUNG = "ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ";
const JONG = ["","ㄱ","ㄲ","ㄳ","ㄴ","ㄵ","ㄶ","ㄷ","ㄹ","ㄺ","ㄻ","ㄼ","ㄽ","ㄾ","ㄿ","ㅀ","ㅁ","ㅂ","ㅄ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const SPLIT = {"ㅘ":"ㅗㅏ","ㅙ":"ㅗㅐ","ㅚ":"ㅗㅣ","ㅝ":"ㅜㅓ","ㅞ":"ㅜㅔ","ㅟ":"ㅜㅣ","ㅢ":"ㅡㅣ",
  "ㄳ":"ㄱㅅ","ㄵ":"ㄴㅈ","ㄶ":"ㄴㅎ","ㄺ":"ㄹㄱ","ㄻ":"ㄹㅁ","ㄼ":"ㄹㅂ","ㄽ":"ㄹㅅ","ㄾ":"ㄹㅌ","ㄿ":"ㄹㅍ","ㅀ":"ㄹㅎ","ㅄ":"ㅂㅅ"};
const jamo = j => SPLIT[j] || j;
function keys(str){
  let out = "";
  for (const ch of str){
    const c = ch.charCodeAt(0) - 0xAC00;
    if (c >= 0 && c < 11172) out += CHO[Math.floor(c / 588)] + jamo(JUNG[Math.floor(c % 588 / 28)]) + jamo(JONG[c % 28]);
    else out += jamo(ch);
  }
  return out;
}
function judge(typed, target){
  const t = [...typed], g = [...target];
  return t.map((ch, i) => {
    if (ch === g[i]) return "ok";
    if (i === t.length - 1 && keys(g.slice(i, i + 2).join("")).startsWith(keys(ch))) return "wait";
    return "bad";
  });
}

/* ───────── 바탕 ───────── */
const Q = new URLSearchParams(location.search);
const TEACH = Q.has("t");
document.body.classList.toggle("teach", TEACH);
const local = /^(localhost|127\.|192\.168\.|10\.)/.test(location.hostname);
const SERVER = Q.get("server") || (local ? "ws://" + (location.hostname || "127.0.0.1") + ":3000/ws" : "wss://class-live-62tz.onrender.com/ws");

function myPid(){                 // 쇼기·퀴즈와 같은 값 — 같은 학생은 늘 같은 이름
  let v = null;
  try { v = localStorage.getItem("shogi-pid"); } catch (e) {}
  if (!v || v.length < 8){
    v = "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
    try { localStorage.setItem("shogi-pid", v); } catch (e) {}
  }
  return v;
}

const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  full: "자리가 다 찼습니다", closed: "지금은 고를 수 없습니다", teams: "여섯 팀이 다 차야 시작합니다",
  lobby: "먼저 팀 고르기를 마감해 주세요", nohello: "다시 들어와 주세요", stale: "다시 로그인해 주세요"};

let sock = null, V = null, skew = 0, joined = null, watchPin = "", token = null;

const send = (t, o) => { if (sock && sock.readyState === 1) sock.send(JSON.stringify(Object.assign({t}, o || {}))); };

const left = until => Math.max(0, Math.ceil((until - now()) / 1000));

/* ───────── 소켓 ───────── */
let hooks = {};                    // 경기 화면이 듣는 것 — typegot / typemiss
function connect(){
  sock = new WebSocket(SERVER);
  sock.onopen = () => {
    $("offline").hidden = true;
    send("hello", {pid: PID});
    if (joined) send(TEACH ? "typewatch" : "typejoin", {code: joined, pin: watchPin});
    else send("typings", {});
  };
  sock.onmessage = e => {
    let m; try { m = JSON.parse(e.data); } catch (x) { return; }
    if (m.t === "me") $("myname").textContent = TEACH ? "교사 화면" : "나: " + m.name;
    else if (m.t === "typings"){ rows = m.typings; if (!joined) gate(); }
    else if (m.t === "typeme"){
      if (!m.code){ seat(null); V = null; return gate(); }
      skew = m.now - Date.now(); seat(m.code); V = m; draw();
    }
    else if (m.t === "typegone"){ seat(null); V = null; gate("대회가 닫혔습니다."); }
    else if (m.t === "typegot"){ hooks.got && hooks.got(m); }
    else if (m.t === "typemiss"){ hooks.miss && hooks.miss(m); }
    else if (m.t === "error"){
      if (m.why === "notype" && joined){ seat(null); V = null; return gate("대회가 사라졌습니다. 서버가 다시 시작됐을 수 있습니다 — 선생님께 알려 주세요."); }
      say(ERR[m.why] || m.why, "bad");
    }
  };
  sock.onclose = () => { sock = null; $("offline").hidden = false; setTimeout(connect, 2000); };
  sock.onerror = () => {};
}
setInterval(() => { if (!joined) send("typings", {}); }, 4000);
function say(text, kind){ const n = $("msg") || $("toast"); if (n){ n.textContent = text || ""; n.className = (n.id === "toast" ? "toast " : "msg ") + (kind || ""); } }

/* 교사가 시키는 일 — 관리자 창구(HTTP)로 간다 */
async function call(what, body){
  let j;
  try {
    const r = await fetch(API + "/admin/" + what, {method: "POST", headers: {"content-type": "application/json"},
      body: JSON.stringify(Object.assign({token}, body || {}))});
    j = await r.json();
  } catch (e) { j = {ok: false, why: "서버에 닿지 않습니다"}; }
  if (j.why === "stale"){ token = null; try { sessionStorage.removeItem("shogi-admin"); } catch (e) {} gate("다시 로그인해 주세요."); }
  else if (!j.ok) say(ERR[j.why] || j.why, "bad");
  return j;
}
const act = (a, o) => call("typeact", Object.assign({code: joined, act: a}, o || {}));

  $("list").onclick = e => { const b = e.target.closest("[data-code]"); if (b){ chose = b.dataset.code; gate(); } };
  const enter = () => { if (!chose) return say("들어갈 대회를 골라 주세요.", "bad"); say("들어가는 중입니다…"); send("typejoin", {code: chose, pin: $("pin").value.replace(/\D/g, "")}); };

async function teacherGate(why){
  $("stage").innerHTML = `<div class="gate"><h2 class="title">교사 화면 — 타자 올림픽</h2>

const pname = (pid, name) => esc(name) + (meP() && pid === V.me.pid ? " (나)" : "");

      ${teachBar(open ? "팀 고르기 중" : "마감됨", open ? `<button class="go" id="tclose">마감</button>` : `<button class="go" id="tstart">시작</button><button id="treopen">다시 열기</button>`)
        + (TEACH ? `<p class="countdown" style="text-align:left;margin:0 0 var(--s3)">학생 주소 <u>${esc(location.host + location.pathname)}</u> · 비밀번호 <u>${esc(watchPin || "없음")}</u></p>

      <div class="lobby">${V.teams.map(t => `<div class="slot ${t.ps.length ? "" : "empty"} ${mine === t.t ? "mine" : ""}" data-team="${t.t}"><div class="slot-h">${tname(t.t)} <span>${t.ps.length}명</span></div>${t.ps.map(chip).join("")}</div>`).join("")}</div>

/* 표 칸 이동 — 칸에 들어가면 커서는 글자 맨 끝, 방향키로 옆 칸. 게임과 연습이 같이 쓴다 */
const MOVE = {ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1]};
function gridKeys(box){
  box.addEventListener("keydown", e => {
    if (e.key === "Enter") return e.preventDefault();
    const d = MOVE[e.key], el = e.target;
    if (!d || e.isComposing || e.shiftKey) return;
    const s = el.selectionStart, n = el.value.length;
    if (d[1] && (s !== el.selectionEnd || (d[1] < 0 && s > 0) || (d[1] > 0 && s < n))) return;
    const to = box.querySelector(`[data-r="${+el.dataset.r + d[0]}"][data-c="${+el.dataset.c + d[1]}"]`);
    e.preventDefault();
    if (to) to.focus();
  });
  box.addEventListener("focusin", e => setTimeout(() => { const n = e.target.value.length; e.target.setSelectionRange(n, n); }, 0));
}
const kb = combos => combos.map(c => c.map(k => `<kbd>${k}</kbd>`).join(`<span class="plus">+</span>`)).join(` <span class="plus">/</span> `);
const keyList = list => `<div class="keys">${list.reduce((h, x, i) => i % 2 ? h + `<div class="key"><span>${kb(list[i - 1])}</span><span class="what">${x}</span></div>` : h, "")}</div>`;
function intro(){
  const e = V.ev;
  const head = `<h2 class="title">${e + 1}종목 · ${V.events[e]}</h2>` + teachBar("학생들이 안내를 보고 있습니다", `<button class="go" id="tgo">${e === 0 ? "조 고르기로" : "첫 판 대진 공개"}</button>`);
  let body;

function vsCard(r, res){
  const sa = r.sa, sb = r.sb;
  const mvp = res ? r.ps.reduce((w, e) => e.score > w.score ? e : w, r.ps[0]) : null;
  const side = (t, mine, theirs) => {
    const es = r.ps.filter(e => e.team === t).sort((x, y) => res ? y.score - x.score : (y.cpm || 0) - (x.cpm || 0));
    const c = teamMedals(t), mul = r.mul ? (t === r.a ? r.mul.a : r.mul.b) : 1;
    const tag = !res ? "" : mine > theirs ? `<span class="tag win">승리</span>` : mine < theirs ? `<span class="tag lose">패배</span>` : `<span class="tag">무승부</span>`;
    const head = `<div class="vs-h">${tname(t)} ${tag}${res ? `<b>${fmt1(mine)}점</b>` : `<span class="vs-sub">${medalCount(c)}</span>`}</div>${mul === 1 ? "" : `<span class="vs-sub">인원 보정 ×${mul.toFixed(2)}</span>`}`;
    const th = res ? "<th>득점</th><th>맞힌 수</th>" : "<th>타/분</th><th>메달</th>";
    const rows = es.map(e => `<tr class="${meP() && e.pid === V.me.pid ? "me" : ""}"><td>${e === mvp ? "👑 " : ""}${pname(e.pid, e.name)}</td>${res ? `<td>${e.score}</td><td>${e.got}</td>`
      : `<td>${e.cpm ? Math.round(e.cpm) : "—"}</td><td>${medalsOf(e.pid, e.team).map(x => `<span class="medal sm ${MEDAL[x.place]}">${MEDAL_TXT[x.place]}</span>`).join("") || "—"}</td>`}</tr>`).join("");
    return `<div class="side ${res && mine > theirs ? "won" : ""}">${head}<table class="t"><tr><th>이름</th>${th}</tr>${rows}</table></div>`;
  };
  return `<div class="vs">${side(r.a, sa, sb)}<div class="vs-mid">VS</div>${side(r.b, sb, sa)}</div>`;
}

/* 치는 글자로 항목을 알아본다. 하나로 좁혀지면 그 항목에 묶는다(오타가 나도 안 풀림).
   칸을 비우거나 고쳐 친 글자가 다른 항목에 맞으면 풀린다. 오타는 지우지 않는다.
   다 맞게 치면 서버에 보내고, 먼저 친 사람이 갖는다. */
function bindTyping(){
  const input = $("tInput");
  let lock = null, sent = null;
  const items = () => V.mine.items || [];
  const byI = i => items().find(x => x.i === i);
  const reset = (hint, msg) => {
    lock = null; sent = null;
    input.blur();
    setTimeout(() => { input.value = ""; paintType(null, hint); input.focus(); }, 0);
    if (msg) toast(msg, "bad");
  };
  const fits = (typed, it) => it && !judge(typed, it.text).includes("bad");
  const update = () => {
    const typed = input.value;
    if (!typed){ lock = null; paintType(null, "치기 시작하면 맞는 항목을 찾는다"); return; }
    const open = items();
    if (lock !== null && !fits(typed, byI(lock)) && open.some(it => fits(typed, it))) lock = null;
    const cand = lock !== null && byI(lock) ? [byI(lock)] : open.filter(it => fits(typed, it));
    if (lock === null && cand.length === 1) lock = cand[0].i;
    const it = cand[0] || null;
    paintType(it ? it.text : null, "맞는 항목이 없다");
    if (it && typed === it.text && sent !== it.i){ sent = it.i; send("typeclaim", {i: it.i, text: typed}); }
  };
  input.addEventListener("input", update);
  input.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === "Escape"){ e.preventDefault(); reset("치기 시작하면 맞는 항목을 찾는다"); } });
  input.addEventListener("paste", e => e.preventDefault());
  input.addEventListener("beforeinput", e => {
    if (e.inputType === "insertText" && /[a-z]/i.test(e.data || "")){ e.preventDefault(); toast("영문 입력 상태다 — 한/영 키를 누르자", "bad"); }
  });
  input.focus();
  hooks.got = m => { reset("다음 항목을 치자"); pop(`+${m.val}점!`, V.mine.a === undefined ? `내 점수 ${myScore().score + m.val}점` : `우리 팀 점수가 올랐다`); };
  hooks.miss = m => { if (m.why === "taken" || m.why === "gone") reset("치기 시작하면 맞는 항목을 찾는다", "마감 — 다른 사람이 먼저 쳤다"); else sent = null; };
  /* 새 모습이 올 때마다 — 치던 항목이 사라졌으면(남이 먼저) 비운다. 내 것이면 typegot 이 먼저 와서 이미 비었다 */
  return () => {
    if (lock === null || sent === lock) return;
    if (!byI(lock)){
      const typed = input.value;
      if (items().some(it => fits(typed, it))){ lock = null; update(); }
      else reset("치기 시작하면 맞는 항목을 찾는다", "마감 — 다른 사람이 먼저 쳤다");
    }
  };
}

function playEdit(){
  const r = V.mine, opp = V.me.team === r.a ? r.b : r.a;
  const HINT = `<span class="hint">남은 항목이 없다</span>`;
  let pos = null, cur = null, sent = null;
  $("stage").innerHTML = `<h2 class="title">3종목 · ${tname(r.a)} vs ${tname(r.b)}</h2>
    <div class="hud"><div><b id="hT">${left(V.ph.until)}</b><span>남은 초</span></div><div><b id="hU">0</b><span>우리 팀 점수</span></div><div><b id="hO">0</b><span>상대 팀 점수</span></div><div><b id="hM">0</b><span>내가 고친 것</span></div><div class="late" id="hL"></div></div>
    <div class="items" id="items"></div>
    <div class="dock"><div class="line target" id="tTarget">${HINT}</div>
    <div class="field"><div class="line ghost" id="tGhost" aria-hidden="true"></div>
    <textarea class="line" id="tInput" rows="1" spellcheck="false" autocomplete="off" disabled></textarea></div>
    <div class="toast" id="toast"></div></div>`;
  const input = $("tInput"), items = () => V.mine.items, byI = i => items().find(x => x.i === i);
  const paint = () => {
    if (input.value.includes("\n")) input.value = input.value.replace(/\n/g, "");
    const it = cur === null ? null : byI(cur);
    const v = [...input.value], g = it ? [...it.text] : [];
    let p = 0; while (p < v.length && v[p] === g[p]) p++;
    let s = 0; while (s < v.length - p && s < g.length - p && v[v.length - 1 - s] === g[g.length - 1 - s]) s++;
    let lo = p, hi = v.length - s;
    if (lo === hi && v.length !== g.length){ lo = Math.max(0, p - 1); hi = Math.min(v.length, lo + 1); }
    $("tGhost").innerHTML = !it ? "" : v.map((ch, i) => i >= lo && i < hi ? `<span class="bad">${esc(ch)}</span>` : esc(ch)).join("") + "​";
    input.style.height = "auto"; input.style.height = input.scrollHeight + 4 + "px";
    if (it && input.value === it.text){ const el = $("toast"); el.textContent = "정답과 같다 — Enter 로 제출"; el.className = "toast ready"; }
    else if ($("toast").classList.contains("ready")) $("toast").textContent = "";
  };
  const drafts = {};
  const load = k => {
    pos = k; const it = items()[k]; cur = it.i;
    $("tTarget").innerHTML = segHtml(it.segs, 1) + " " + badge(it);
    input.disabled = false; input.value = drafts[cur] ?? segText(it.segs, 0); input.focus();
    input.setSelectionRange(0, 0);
    paint(); list();
  };
  const step = dir => {
    const n = items().length;
    if (!n){ pos = cur = null; input.disabled = true; $("tTarget").innerHTML = HINT; return; }
    load(pos === null ? 0 : (pos + dir + n) % n);
  };
  const submit = () => {
    if (cur === null) return;
    paint();
    if (input.value !== byI(cur).text) return toast("아직 정답과 다르다 — 밑줄 친 곳을 고치자", "bad");
    sent = cur; send("typeclaim", {i: cur, text: input.value});
  };
  hooks.got = m => { sent = null; pop(`+${m.val}점 획득!`, "우리 팀 점수가 올랐다"); };
  hooks.miss = m => { sent = null; if (m.why === "taken" || m.why === "gone") toast("마감 — 상대나 팀원이 먼저 고쳤다", "bad"); };
  const list = () => {
    const html = items().map((it, k) => `<div class="item click ${pos === k ? "on" : ""}" data-k="${k}"><span>${segHtml(it.segs, 0)} → ${segHtml(it.segs, 1)} ${badge(it)}</span></div>`).join("");
    if ($("items").innerHTML !== html) $("items").innerHTML = html;
  };
  $("items").onclick = e => { const el = e.target.closest("[data-k]"); if (el) load(+el.dataset.k); };
  let pending = null;
  const keyAct = k => k === "Enter" ? submit() : step(k === "ArrowDown" ? 1 : -1);
  input.addEventListener("keydown", e => {
    if (e.key === "Escape" && cur !== null){ input.value = segText(byI(cur).segs, 0); drafts[cur] = input.value; paint(); }
    if (!["Enter", "ArrowUp", "ArrowDown"].includes(e.key)) return;
    e.preventDefault();
    if (e.isComposing || e.keyCode === 229) pending = e.key; else keyAct(e.key);
  });
  input.addEventListener("compositionend", () => { if (pending){ const k = pending; pending = null; setTimeout(() => keyAct(k), 0); } });
  input.addEventListener("input", () => { if (cur !== null) drafts[cur] = input.value; paint(); });
  input.addEventListener("paste", e => e.preventDefault());
  step(1);
  const frame = () => {
    /* 내가 고르던 자리에 다른 문장이 들어왔다 — 내가 냈든 남이 먼저 했든 같은 자리의 새 문장으로 */
    if (pos !== null && items()[pos] && items()[pos].i !== cur){
      const mine = sent === cur; load(pos);
      if (!mine) toast("마감 — 상대나 팀원이 먼저 고쳤다. 그 자리에 새 문장", "bad");
    }
    $("hU").textContent = fmt1(ourScore()); $("hO").textContent = fmt1(theirScore()); $("hM").textContent = myScore().got;
    $("hL").textContent = isLate() ? "후반! 새로 나오는 문장은 30·40·50점" : "";
    list();
  };
  frame(); upd = frame;
}

/* ───────── 4종목 표 — 과제는 각자 화면에서 만든다 ───────── */
const E4_HEAD = ["제품명", "모델명", "단가", "공급가액", "비고"];
const E4_ITEMS = [
  ["산업용 제습기", "LX20-MV-280PK"], ["업소용 공기청정기", "AP45-HC-1200WT"], ["시스템 냉난방기", "HV36-SC-3400GR"],
  ["무선 바코드 스캐너", "BS10-RF-750BK"], ["회의실 전자칠판", "EB86-TQ-4100SV"], ["고속 문서 세단기", "SD32-XC-920GY"],
  ["사무용 복합기", "MF55-LS-2650WH"], ["랙형 무정전 전원장치", "UP30-RK-1500BK"],
];
const E4_NOTES = [
  "재고 확인 바람. 입고 예정일이 협력사 사정으로 지연될 수 있으므로 발주 전 담당자와 재확인할 것.",

];
const E4_ROWS = 4;
const won = () => (1000 + Math.floor(Math.random() * 9000)) * 1000;   // 7자리 원
const money = n => n.toLocaleString("ko-KR");
function newTable(){
  const items = shuffle(E4_ITEMS).slice(0, E4_ROWS), notes = shuffle(E4_NOTES);
  const rows = items.map(([name, code], i) => [name, code, money(won()), money(won()), notes[i]]);
  rows[Math.floor(Math.random() * E4_ROWS)][4] = "";   // 비고 하나는 비워 둔다 — 옮겨 붙일 자리
  return [[...E4_HEAD], ...rows];
}
// 과제마다 g 를 고치고 이름을 돌려준다. 못 하는 상황이면 false. g.how = 무엇을 하라는지 한 줄,
// g.mark = 테두리를 칠 행들. 행을 지우면 빈 행이 생긴다 — 빈 행은 많아야 둘, 다른 과제는 빈 행을 건드리지 않는다
const pick = a => a[Math.floor(Math.random() * a.length)];
const bodyRows = () => [...Array(E4_ROWS)].map((_, i) => i + 1);
const col = h => E4_HEAD.indexOf(h);
const filled = g => bodyRows().filter(r => g[r].some(v => v));
const blank = g => bodyRows().filter(r => g[r].every(v => !v));
// 비고 고치기: 앞의 말이 비고에 있으면 뒤의 말로 바꾼다
const E4_NOTE_EDIT = [["확인 바람","검토 바람"],["협력사","거래처"],["담당자","책임자"],["인상","인하"],["첨부","제출"],
  ["10일","15일"],["별도 금액","포함 금액"],["2건","3건"],["반품","교환"],["다음 분기","다음 달"],["보류","중단"],
  ["승인","협의"],["2년","3년"],["요청","의뢰"],["변동","조정"],["만료","임박"],["지연","취소"],["정산","결제"]];
const E4_TASK = {
  // 모델명 한 줄의 가운데 숫자를 바꾼다: LX20-MV-280PK → LX20-MV-5600PK
  model(g){
    const c = col("모델명"), r = pick(filled(g));
    g[r][c] = g[r][c].replace(/\d+(?=[A-Z]+$)/, d => { let x; do x = String(Math.floor(rand(10, 990)) * 10); while (x === d); return x; });
    g.how = "모델명에서 노랗게 칠한 부분을 정답대로 고친다";
    return "모델명 고치기";
  },
  // 비고 안의 말 하나를 바꾼다
  noteEdit(g){
    const c = col("비고"), pairs = E4_NOTE_EDIT.flatMap(([x, y]) => [[x, y], [y, x]]);   // 양쪽으로 — 한 번 바꾼 말도 다시 고칠 거리가 된다
    const cand = filled(g).flatMap(r => pairs.filter(([x]) => g[r][c].includes(x)).map(e => [r, e]));
    if (!cand.length) return false;
    const [r, [x, y]] = pick(cand);
    g[r][c] = g[r][c].replace(x, y);
    g.how = "비고에서 노랗게 칠한 부분을 정답대로 고친다";
    return "비고 고치기";
  },
  // 비고 하나를 빈 비고 칸으로 잘라 옮긴다
  note(g){
    const c = col("비고"), empty = filled(g).filter(r => !g[r][c]), full = filled(g).filter(r => g[r][c]);
    if (!empty.length || !full.length) return false;
    const to = pick(empty), from = pick(full);
    g[to][c] = g[from][c]; g[from][c] = "";
    g.how = "비고를 잘라 내(Ctrl+X) 빈 비고 칸에 붙인다(Ctrl+V)";
    return "비고 옮기기";
  },
  // 비고 하나를 지운다 (비고가 둘 이상 남아 있을 때만 — 옮길 거리가 남게)
  noteDel(g){
    const c = col("비고"), full = filled(g).filter(r => g[r][c]);
    if (full.length < 2) return false;
    g[pick(full)][c] = "";
    g.how = "노랗게 칠한 비고 칸을 비운다";
    return "비고 지우기";
  },
  // 금액 열 하나를 모두 0 으로
  zero(g){
    const cs = [col("단가"), col("공급가액")].filter(c => filled(g).some(r => g[r][c] !== "0"));
    if (!cs.length) return false;
    const c = pick(cs);
    filled(g).forEach(r => g[r][c] = "0");
    g.how = `${g[0][c]} 열의 금액을 모두 0으로 바꾼다`;
    return `${g[0][c]} 열 0으로`;
  },
  // 한 행을 모두 빈 칸으로 (빈 행이 하나 이하이고 채운 행이 셋 이상일 때만)
  clear(g){
    if (blank(g).length > 1 || filled(g).length < 3) return false;
    const r = pick(filled(g));
    g[r] = g[r].map(() => "");
    g.mark = [r]; g.how = "테두리 친 행의 칸을 모두 비운다";
    return "행 지우기";
  },
  // 한 행을 빈 행으로 통째로 옮긴다 (빈 행이 있을 때만)
  move(g){
    const to = pick(blank(g));
    if (to === undefined) return false;
    const from = pick(filled(g));
    g[to] = g[from]; g[from] = g[from].map(() => "");
    g.mark = [from, to]; g.how = "테두리 친 행을 빈 행으로 통째로 옮긴다 (잘라 내 붙이기)";
    return "행 옮기기";
  },
};
const E4_TIERS = [["model", "noteEdit", "note", "noteDel"], ["zero", "clear"], ["move"]];   // 짧음 · 중간 · 긺
// 그 등급에 할 과제가 없으면(행 지우기·열 0으로는 경기마다 몇 번 못 한다) 가까운 등급에서 낸다. g.tier = 실제로 낸 등급
function nextGoal(cur, tier){
  const order = [0, 1, 2].sort((a, b) => Math.abs(a - tier) - Math.abs(b - tier) || b - a);
  for (const t of order){
    const g = cur.map(row => [...row]);
    for (const k of shuffle(E4_TIERS[t])){ const name = E4_TASK[k](g); if (name){ g.task = name; g.tier = t; return g; } }
  }
}

function playTable(){

    <div class="tables"><div><p class="sub">정답 표 <span id="gb"></span></p><table class="grid goal" id="goal"></table></div>

    <div class="toast" id="toast"></div>`;
  const cols = `<colgroup><col style="width:17%"><col style="width:17%"><col style="width:12%"><col style="width:12%"><col></colgroup>`;
  const cell = (v, r, c) => r && c === 4 ? `<textarea data-r="${r}" data-c="${c}" rows="2" spellcheck="false">${esc(v)}</textarea>`
    : `<input data-r="${r}" data-c="${c}" value="${esc(v)}" spellcheck="false" autocomplete="off">`;
  const cls = (r, c) => `${r ? "" : "head"} ${c === 2 || c === 3 ? "num" : ""}`;
  $("mine").innerHTML = cols + cur.map((row, r) => `<tr>${row.map((v, c) => `<td class="${cls(r, c)}">${cell(v, r, c)}</td>`).join("")}</tr>`).join("");
  const read = () => cur.map((row, r) => row.map((_, c) => $("mine").querySelector(`[data-r="${r}"][data-c="${c}"]`).value));
  const kind = (a, b) => a === b ? "" : a && b ? "part" : "diff";
  const part = (a, b) => {
    const x = [...a], y = [...b]; let p = 0, q = 0;
    while (p < x.length && p < y.length && x[p] === y[p]) p++;
    while (q < x.length - p && q < y.length - p && x[x.length - 1 - q] === y[y.length - 1 - q]) q++;
    const mid = y.slice(p, y.length - q).join("");
    return esc(y.slice(0, p).join("")) + `<mark class="chg ${mid ? "" : "gap"}">${esc(mid)}</mark>` + esc(y.slice(y.length - q).join(""));
  };
  const paint = () => {

    $("gb").innerHTML = gb() + ` <b>${goal.task}</b> <span class="how">— ${goal.how}</span>`;
    const swap = r => goal.mark && goal.mark.includes(r) ? "swap" : "";
    $("goal").innerHTML = cols + goal.map((row, r) => `<tr>${row.map((v, c) => { const k = kind(now[r][c], v);
      return `<td class="${cls(r, c)} ${k} ${swap(r)}">${k === "part" ? part(now[r][c], v) : esc(v)}</td>`; }).join("")}</tr>`).join("");
    $("mine").querySelectorAll("input, textarea").forEach(el => { const k = kind(el.value, goal[+el.dataset.r][+el.dataset.c]);
      el.parentElement.classList.toggle("diff", k === "diff"); el.parentElement.classList.toggle("part", k === "part"); });
  };
  hooks.got = m => pop(`+${m.val}점!`, "우리 팀 점수가 올랐다");
  $("mine").addEventListener("input", () => {
    const now = read();
    if (now.every((row, r) => row.every((v, c) => v === goal[r][c]))){
      send("typetable", {tier: goal.tier});
      cur = now; setGoal();   // 내 표와 커서는 그대로 둔다
    }
    paint();
  });
  paint();
  gridKeys($("mine"));
  $("mine").querySelector("input").focus();
  const frame = () => {
    $("hU").textContent = fmt1(ourScore()); $("hO").textContent = fmt1(theirScore()); $("hC").textContent = myScore().got;
    $("hL").textContent = isLate() ? "후반! 새 과제는 30·40·50점" : "";
    $("gb").innerHTML = gb() + ` <b>${goal.task}</b> <span class="how">— ${goal.how}</span>`;
  };
  frame(); upd = frame;
}

      ${res.teams.map((x, i) => `<tr class="${x.team === mine ? "me" : ""}"><td>${i + 1}</td><td>${tname(x.team)}</td><td>${won(x.team)}</td><td>${x.val}</td><td>${medalCount(teamMedals(x.team))}</td></tr>`).join("")}</table>
    <div class="sheet">
      ${mine === null ? "<div></div>" : `<div><h3>우리 팀 · ${tname(mine)}</h3><table class="t"><tr><th>이름</th><th>누적 메달</th>${ths}</tr>${ours.map(r => `<tr class="${r.pid === V.me.pid ? "me" : ""}"><td>${pname(r.pid, r.name)}</td>${pMedals(r)}${cells(r)}</tr>`).join("")}</table></div>`}
      <div><h3>MVP — 메달과 상관없이 가장 잘한 셋</h3><table class="t"><tr><th></th><th>이름</th><th>팀</th><th>누적 메달</th>${ths}</tr>${mvp.map((r, i) => `<tr class="${meP() && r.pid === V.me.pid ? "me" : ""}"><td>${i + 1}</td><td>👑 ${pname(r.pid, r.name)}</td><td>${tname(r.team)}</td>${pMedals(r)}${cells(r)}</tr>`).join("")}</table></div>
    </div>`;
  if (TEACH) $("tgo").onclick = () => act("go");
}
function finale(){
  const t = [0, 1, 2, 3, 4, 5].filter(x => V.teams[x].ps.length).map(x => { const c = teamMedals(x); return {team: x, g: c[0], s: c[1], b: c[2]}; })
    .sort((a, b) => b.g - a.g || b.s - a.s || b.b - a.b);
  const mine = meP() ? V.me.team : null;
  const won = (ev, team) => V.medals.filter(m => m.ev === ev && m.team === team).sort((a, b) => a.place - b.place)
    .map(m => `<span class="medal sm ${MEDAL[m.place]}">${MEDAL_TXT[m.place]}</span>`).join("") || "—";
  /* 우리 팀 — 사람마다 누적 메달 (팀 메달 + 1종목 개인 메달) */
  const ours = mine === null ? [] : V.teams[mine].ps.map(p => { const c = [0, 0, 0]; medalsOf(p.pid, mine).forEach(m => c[m.place]++); return {pid: p.pid, name: p.name, c}; })
    .sort((a, b) => b.c[0] - a.c[0] || b.c[1] - a.c[1] || b.c[2] - a.c[2]);
  const row = (p, lead) => `<tr class="${meP() && p.pid === V.me.pid ? "me" : ""}">${lead}<td>${medalCount(p.c)}</td></tr>`;
  $("stage").innerHTML = `<div class="res-head"><h2 class="title">종합 발표</h2></div><p class="sub">누적 메달 — 금메달 수, 같으면 은메달, 같으면 동메달 순.</p>
    <table class="t" style="white-space:nowrap"><tr><th>순위</th><th>팀</th>${V.events.map((_, i) => `<th>${i + 1}종목</th>`).join("")}<th>누적 메달</th></tr>
      ${t.map((r, i) => `<tr class="${r.team === mine ? "me" : ""}"><td>${i + 1}</td><td>${tname(r.team)}</td>${V.events.map((_, e) => `<td>${won(e, r.team)}</td>`).join("")}<td>${medalCount([r.g, r.s, r.b])}</td></tr>`).join("")}</table>
    <div class="sheet">
      ${mine === null ? "<div></div>" : `<div><h3>우리 팀 · ${tname(mine)}</h3><table class="t"><tr><th>이름</th><th>누적 메달</th></tr>${ours.map(p => row(p, `<td>${pname(p.pid, p.name)}</td>`)).join("")}</table></div>`}
      <div><h3>MVP — 네 종목 득점 합, 팀마다 한 명</h3><table class="t" style="white-space:nowrap"><tr><th></th><th>이름</th><th>팀</th>${V.events.map((_, i) => `<th>${i + 1}종목</th>`).join("")}<th>합계</th></tr>${(V.mvp || []).map((p, i) => `<tr class="${meP() && p.pid === V.me.pid ? "me" : ""}"><td>${i + 1}</td><td>👑 ${pname(p.pid, p.name)}</td><td>${tname(p.team)}</td>${V.events.map((_, e) => `<td>${p.ev[e] ?? "—"}</td>`).join("")}<td><b>${p.sum}</b></td></tr>`).join("")}</table></div>
    </div>`;
}

gate();
connect();
</script>
