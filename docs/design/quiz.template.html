<!doctype html><html lang="ko"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>한글 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;700;800&family=Gowun+Batang:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 흰 바탕에 검정 글씨로 고정한다. 기기가 어둡든 말든 이 판은 밝다 —
   color-scheme 와 meta 둘이 안드로이드 크롬의 강제 어둠기를 막는다 */
:root{
  color-scheme:light;
  --wall:#ffffff; --wall-2:#f6f6f7; --wall-line:#dcdce1;
  --chalk:#16171a; --chalk-dim:#63646b; --mark:#8a5a00; --gold:#f0c75e;
  --win:#1f7a3d; --lose:#c62828; --wait:#2d5f9a;
  --s1:4px; --s2:10px; --s3:16px; --s4:24px; --s5:36px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;background:var(--wall);color:var(--chalk);
  font:400 15px/1.6 'Gothic A1',system-ui,sans-serif;
  -webkit-text-size-adjust:100%}
body{padding:var(--s3) var(--s3) var(--s5)}
.wrap{max-width:720px;margin:0 auto}
h1{font-family:'Gowun Batang',serif;font-size:24px;margin:0 0 var(--s1)}
.sub{color:var(--chalk-dim);font-size:13.5px;margin:0 0 var(--s3)}
.card{background:var(--wall-2);border:1px solid var(--wall-line);border-radius:10px;
  padding:var(--s3);margin-bottom:var(--s3)}
label{display:block;font-size:12.5px;color:var(--chalk-dim);margin-bottom:5px}
input{width:100%;background:var(--wall);color:var(--chalk);
  border:1px solid var(--wall-line);border-radius:6px;padding:12px;
  font:400 16px/1 'Gothic A1',system-ui,sans-serif}
input:focus{outline:none;border-color:var(--mark)}
input.pin{font-family:'JetBrains Mono',monospace;letter-spacing:.3em;text-align:center}
.row{display:flex;gap:var(--s2);align-items:flex-end;flex-wrap:wrap}
.row>div{flex:1;min-width:120px}
button{font:700 14px/1 'Gothic A1',system-ui,sans-serif;cursor:pointer;
  border-radius:999px;padding:13px 20px;border:1px solid var(--wall-line);
  background:none;color:var(--chalk-dim);white-space:nowrap}
button.go{background:var(--gold);color:#16171a;border-color:#d9ad38}
button:disabled{opacity:.4}
.msg{margin:var(--s2) 0 0;font-size:13.5px;min-height:1.3em;color:var(--chalk-dim)}
.msg.bad{color:var(--lose)} .msg.good{color:var(--win)}
.hint{color:var(--chalk-dim);font-size:13px;margin:var(--s2) 0 0}
.who{font-weight:700;color:var(--mark)}

/* 고를 퀴즈 목록 */
.pickrow{display:flex;align-items:center;gap:var(--s2);width:100%;
  padding:13px var(--s3);margin-bottom:8px;border-radius:8px;text-align:left}
.pickrow.on{border-color:var(--mark);background:#fdf5e2}
.pickrow .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;color:var(--chalk);font-weight:700}
.pickrow .n{font-size:12px;color:var(--chalk-dim);flex:none}
.tag{font:700 11px/1 'Gothic A1',system-ui,sans-serif;padding:5px 9px;
  border-radius:999px;background:var(--wall);border:1px solid var(--wall-line);
  color:var(--chalk-dim);flex:none}
.tag.open{color:var(--wait);border-color:#bcd0e6}
.tag.running{color:var(--mark);border-color:#e3c88a}
.tag.done{color:var(--win);border-color:#b7d8c2}

/* 판 머리 */
.top{display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap;
  margin-bottom:var(--s2)}
.top .nth{font:700 13px/1 'JetBrains Mono',monospace;color:var(--chalk-dim)}
.top .team{font-weight:800;color:var(--mark)}
.top .spent{margin-left:auto;font:700 20px/1 'JetBrains Mono',monospace;
  color:var(--mark)}
.top .spent.full{color:var(--lose)}

/* 점판 */
.pit{background:#fff;border:1px solid var(--wall-line);border-radius:10px;
  padding:var(--s2);display:flex;align-items:center;justify-content:center;
  min-height:120px}
.pit canvas{display:block;width:100%;height:auto;image-rendering:pixelated}

/* 답 */
.say{display:flex;gap:var(--s2);margin-top:var(--s2)}
.say input{flex:1;min-width:0;font-size:19px;text-align:center;letter-spacing:.08em}
.say.miss input{border-color:var(--lose);color:var(--lose)}

/* 정답 공개 */
.shout{margin-top:var(--s3);padding:var(--s3);border-radius:10px;
  background:#fdf5e2;border:1px solid #e3c88a;text-align:center}
.shout .word{font-family:'Gowun Batang',serif;font-size:34px;font-weight:700;
  color:var(--lose);letter-spacing:.1em;margin-bottom:6px}
.shout .scorer{font-size:27px;font-weight:800;color:var(--mark);line-height:1.3}
.shout .mates{font-size:17px;font-weight:700;line-height:1.5;color:var(--chalk);
  margin-top:6px}
.shout .bdg{font-size:12px;padding:3px 7px}
.shout .got{display:inline-block;margin-top:8px;padding:6px 14px;border-radius:999px;
  background:var(--gold);color:#16171a;font:800 17px/1 'JetBrains Mono',monospace}
.shout .move{margin-top:10px;font:800 26px/1 'Gothic A1',system-ui,sans-serif;
  color:var(--win)}
.shout .move.down{color:var(--lose)}
.shout.none{background:var(--wall-2);border-color:var(--wall-line)}
.shout.none .mates{font-size:15px;color:var(--chalk-dim);font-weight:400}

/* 순위판 */
.ranks{margin-top:var(--s3);display:flex;flex-direction:column;gap:4px}
.rankrow{display:flex;align-items:baseline;gap:var(--s2);padding:9px 11px;
  background:var(--wall-2);border:1px solid var(--wall-line);border-radius:7px}
.rankrow.mine{border-color:var(--wait)}
.rankrow.hot{border-color:var(--mark);background:#fdf5e2}
.place{font:700 13px/1 'JetBrains Mono',monospace;color:var(--chalk-dim);
  flex:none;width:36px}
.rankrow.hot .place{color:var(--mark)}
.tname{font-weight:800;flex:none}
.mates{flex:1;min-width:0;font-size:12px;color:var(--chalk-dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pts{font:700 16px/1 'JetBrains Mono',monospace;color:var(--mark);flex:none}
.pill{font:700 10px/1 'Gothic A1',system-ui,sans-serif;padding:3px 6px;
  border-radius:999px;background:var(--wall);color:var(--chalk-dim);margin-left:5px}

/* 닉네임에 붙는 뱃지 — 금은 맞힌 횟수, 붉은 것은 틀린 횟수. 횟수만 적는다 */
.mate{white-space:nowrap}
.mate.hero{color:var(--mark);font-weight:800}
.dot{color:var(--chalk-dim);margin:0 5px}
.bdg{font:700 10px/1 'JetBrains Mono',monospace;padding:2px 5px;border-radius:999px;
  margin-left:3px;vertical-align:middle;display:inline-block}
.bdg.hit{background:var(--gold);color:#16171a}
.bdg.miss{background:#f7dad7;color:var(--lose)}
</style>

<div class="wrap">

  <!-- ① 퀴즈 고르기 -->
  <section id="pick">
    <h1>한글 퀴즈</h1>
    <p class="sub">내 이름은 <span class="who" id="myname">…</span> 입니다.
      이름은 고를 수 없습니다.</p>
    <div class="card">
      <div id="list"></div>
      <p class="hint" id="none" hidden>아직 열린 퀴즈가 없습니다.
        선생님이 열면 저절로 뜹니다.</p>
      <div class="row" style="margin-top:var(--s3)">
        <div style="max-width:150px">
          <label for="pin">참가 비밀번호</label>
          <input id="pin" class="pin" inputmode="numeric" maxlength="4">
        </div>
        <button class="go" id="enter">들어가기</button>
      </div>
      <p class="msg" id="pickMsg"></p>
    </div>
  </section>

  <!-- ② 기다리기 -->
  <section id="lobby" hidden>
    <h1 id="lobbyTitle">한글 퀴즈</h1>
    <p class="sub">들어왔습니다. 선생님이 팀을 짤 때까지 기다립니다.</p>
    <div class="card">
      <p style="margin:0">내 이름 <span class="who" id="lobbyName"></span></p>
      <p class="hint">지금 <b id="lobbyN">0</b>명이 기다리고 있습니다.</p>
      <button id="out" style="margin-top:var(--s2)">나가기</button>
    </div>
  </section>

  <!-- ③ 판 -->
  <section id="play" hidden>
    <div class="top">
      <span class="nth" id="nth"></span>
      <span class="team" id="myteam"></span>
      <span class="spent" id="spent"></span>
    </div>
    <div class="pit"><canvas id="board" width="10" height="10"></canvas></div>
    <div class="say" id="sayBox">
      <input id="text" type="text" inputmode="text" autocomplete="off"
             autocapitalize="off" spellcheck="false" maxlength="12">
      <button class="go" id="send">보내기</button>
    </div>
    <p class="msg" id="playMsg"></p>
    <div id="shout"></div>
    <div class="ranks" id="ranks"></div>
  </section>

</div>

<script>
/* ═══ 한글 퀴즈 — 학생 화면 ═══════════════════════════════════════════
   서버가 심판이다. 여기서 하는 일은 셋뿐 — 낱장 한 장을 칠하고, 답을
   보내고, 서버가 돌려준 순위를 옮긴다.

   **답은 서버만 안다.** 내려오는 것은 「지금 보여 줄 낱장 한 장」의 16진수
   줄뿐이고, 성한 글씨는 누군가 맞힌 뒤에야 온다. 그래서 소스를 열어도
   먼저 알 길이 없다.

   글꼴도 모른다. 글자는 14x14 점판이라 어느 기기에서나 같은 그림이다.
   ═══════════════════════════════════════════════════════════════════ */
(() => {
"use strict";
const el = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clock = s => {
  const neg = s < 0, n = Math.abs(s | 0);
  return (neg ? "-" : "") + Math.floor(n / 60) + ":" + ("0" + (n % 60)).slice(-2);
};

const N = 14;                         /* 점판 한 변 */
const GAP = 3;                        /* 글자 사이 틈 (칸) */

/* 사람을 알아보는 것은 이 값 하나다. 대국 화면과 같은 것을 쓴다 —
   같은 학생이 쇼기에서도 퀴즈에서도 같은 이름으로 나온다. */
function myPid(){
  let v = null;
  try { v = localStorage.getItem("shogi-pid"); } catch (e) {}
  if (!v || v.length < 8){
    v = "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
    try { localStorage.setItem("shogi-pid", v); } catch (e) {}
  }
  return v;
}
const PID = myPid();
const Q = new URLSearchParams(location.search);
const SERVER = Q.get("server") || (
  /^(localhost|127\.|192\.168\.|10\.)/.test(location.hostname)
    ? "ws://" + (location.hostname || "127.0.0.1") + ":3000/ws"
    : "wss://mini-game-y8ve.onrender.com/ws");

const ERR = {badpin:"비밀번호가 맞지 않습니다", noquiz:"없는 퀴즈입니다",
             closed:"이미 시작한 퀴즈입니다", full:"자리가 다 찼습니다",
             wait:"정답을 보여 주는 중입니다", slow:"조금 천천히 눌러 주세요",
             empty:"답을 적어 주세요", stranger:"팀에 들어 있지 않습니다",
             notrunning:"지금은 답을 받지 않습니다", nohello:"다시 들어와 주세요"};
const STATE = {open:"접수 중", running:"진행 중", done:"끝남"};

let sock = null, me = null, rows = [], chose = null;
let joined = null;                    /* 들어간 퀴즈 코드 — 끊기면 이걸로 돌아온다 */
let V = null;                         /* 마지막으로 받은 내 모습 */
let gotAt = 0;                        /* 그것을 받은 때 — 경과를 여기서 센다 */

/* ── 소켓 ─────────────────────────────────────────────────────────── */
const send = (t, o) => {
  if (sock && sock.readyState === 1) sock.send(JSON.stringify(Object.assign({t}, o || {})));
};
function connect(){
  sock = new WebSocket(SERVER);
  sock.onopen = () => {
    send("hello", {pid: PID});
    send("quizzes", {});
    if (joined) send("quizjoin", {code: joined});     /* 돌아온 사람은 비번이 없다 */
  };
  sock.onmessage = e => {
    let m; try { m = JSON.parse(e.data); } catch (x) { return; }
    if (m.t === "me"){ me = m; el("myname").textContent = m.name;
                       el("lobbyName").textContent = m.name; }
    else if (m.t === "quizzes"){ rows = m.quizzes; paintList(); }
    else if (m.t === "quizme"){ take(m.code ? m : null); }
    else if (m.t === "quizgone"){ joined = null; take(null);
                                  say("pickMsg", "퀴즈가 닫혔습니다.", "bad"); }
    else if (m.t === "quizmiss"){ miss(m); }
    else if (m.t === "error"){ oops(m.why); }
  };
  sock.onclose = () => { sock = null; setTimeout(connect, 2000); };
  sock.onerror = () => {};
}
/* 목록을 가끔 다시 받는다. 선생님이 퀴즈를 열면 저절로 뜬다 */
setInterval(() => { if (!joined) send("quizzes", {}); }, 4000);

function say(node, text, kind){
  const n = el(node);
  n.textContent = text || "";
  n.className = "msg" + (kind ? " " + kind : "");
}
function oops(why){
  const text = ERR[why] || why;
  say(joined ? "playMsg" : "pickMsg", text, "bad");
  if (!joined) return;
  setTimeout(() => { if (joined) say("playMsg", ""); }, 2500);
}

/* ── ① 퀴즈 고르기 ───────────────────────────────────────────────── */
function paintList(){
  el("none").hidden = rows.length > 0;
  el("list").innerHTML = rows.map(q =>
    '<button class="pickrow' + (chose === q.code ? " on" : "") +
      '" data-code="' + esc(q.code) + '">' +
      '<span class="t">' + esc(q.title) + '</span>' +
      '<span class="n">' + q.people + '명</span>' +
      '<span class="tag ' + q.state + '">' + STATE[q.state] + '</span>' +
    '</button>').join("");
  el("list").querySelectorAll("button[data-code]").forEach(b =>
    b.addEventListener("click", () => { chose = b.dataset.code; paintList(); }));
  if (!chose && rows.length === 1) { chose = rows[0].code; paintList(); }
}
el("enter").addEventListener("click", () => {
  if (!chose) return say("pickMsg", "들어갈 퀴즈를 골라 주세요.", "bad");
  const pin = el("pin").value.replace(/[^0-9]/g, "");
  say("pickMsg", "들어가는 중입니다…");
  send("quizjoin", {code: chose, pin});
});
el("out").addEventListener("click", () => { joined = null; send("quizleave", {}); });

/* ── 답 ───────────────────────────────────────────────────────────── */
function submit(){
  const text = el("text").value.trim();
  if (!text) return;
  el("text").value = "";
  el("text").focus();                 /* 자판을 붙잡아 둔다 — 다음 답이 급하다 */
  send("quizsay", {text});
}
el("send").addEventListener("click", submit);
el("text").addEventListener("keydown", e => {
  if (e.key === "Enter"){ e.preventDefault(); submit(); }
});
/* 틀렸다 — 입력칸이 잠깐 붉어진다. 숫자로 말하지 않는다 */
function miss(m){
  el("sayBox").classList.add("miss");
  setTimeout(() => el("sayBox").classList.remove("miss"), 700);
  say("playMsg", m.again ? "아까 낸 답입니다." : "틀렸습니다 — 20초 깎였습니다.", "bad");
  setTimeout(() => say("playMsg", ""), 2000);
}

/* ── ② ③ 들어온 뒤 ───────────────────────────────────────────────── */
function take(v){
  V = v; gotAt = Date.now();
  if (!v){
    joined = null;
    el("pick").hidden = false; el("lobby").hidden = true; el("play").hidden = true;
    send("quizzes", {});
    return;
  }
  joined = v.code;
  say("pickMsg", "");
  el("pick").hidden = true;
  const waiting = v.state === "open";
  el("lobby").hidden = !waiting;
  el("play").hidden = waiting;
  if (waiting){
    el("lobbyTitle").textContent = v.title;
    el("lobbyN").textContent = v.people;
    return;
  }
  paintPlay();
}

function paintPlay(){
  const v = V;
  if (!v) return;
  /* 몇 문제가 남았는지는 밝히지 않는다 — 「끝」을 맞히면 그때 안다 */
  el("nth").textContent = v.state === "done" ? "끝" : "문제 " + v.nth;
  el("myteam").textContent = v.team ? v.team.name : "";
  el("sayBox").hidden = !v.ask;
  if (v.ask) el("text").focus();
  shout();
  ranks();
  tick();
}

/* 경과한 초를 혼자 센다. 서버가 4초마다 보내 주는 것을 그 사이에 잇는다 */
function tick(){
  const v = V;
  if (!v || !v.ask){ el("spent").textContent = ""; return; }
  const n = Math.min(v.ask.cap, v.ask.spent + Math.floor((Date.now() - gotAt) / 1000));
  el("spent").textContent = clock(n) + " / " + clock(v.ask.cap);
  el("spent").classList.toggle("full", n >= v.ask.cap);
}
setInterval(tick, 250);

/* ── 점판 ─────────────────────────────────────────────────────────── */
/* 16진수 네 자리 한 줄이 가로 14칸이다. 맨 왼쪽 칸이 비트 13 */
function ink(sheet, color, over, overColor){
  const cv = el("board");
  const n = sheet.length;
  const wide = n * N + (n - 1) * GAP;
  const z = Math.max(2, Math.min(28, Math.floor(620 / wide)));
  cv.width = wide * z; cv.height = N * z;
  /* 한 글자짜리가 화면을 다 먹지 않게 — 칸 하나는 20px 까지다 */
  cv.style.maxWidth = (wide * 28) + "px";
  const g = cv.getContext("2d");
  g.clearRect(0, 0, cv.width, cv.height);
  const lay = (one, c) => {
    g.fillStyle = c;
    one.forEach((hexed, i) => {
      const ox = i * (N + GAP) * z;
      for (let y = 0; y < N; y++){
        const row = parseInt(hexed.substr(y * 4, 4), 16);
        for (let x = 0; x < N; x++)
          if (row & (1 << (N - 1 - x))) g.fillRect(ox + x * z, y * z, z, z);
      }
    });
  };
  lay(sheet, color);
  if (over) lay(over, overColor);        /* 덮어 칠한다 — 낱장은 성한 글자의 일부다 */
}

/* 정답 공개 — 성한 글씨를 붉게 세운 다음, 세 낱장을 0.5초마다 돌린다.
   한 장만 보던 것이 어떻게 겹쳐 글자가 되는지 눈으로 봐야 다음에 는다. */
let film = null;
function shout(){
  const v = V;
  const box = el("shout");
  if (!v.reveal){
    if (film){ clearInterval(film); film = null; }
    box.innerHTML = "";
    if (v.ask) ink(v.ask.sheet, "#16171a");
    return;
  }
  const r = v.reveal;
  const move = r.from && r.to && r.from !== r.to
    ? '<div class="move' + (r.to > r.from ? " down" : "") + '">' +
      r.from + '위 → ' + r.to + '위</div>' : "";
  box.innerHTML = r.by === null
    ? '<div class="shout none"><div class="word">' + esc(r.word) + '</div>' +
      '<div class="mates">아무도 못 맞혔습니다</div></div>'
    : '<div class="shout"><div class="word">' + esc(r.word) + '</div>' +
      '<div class="scorer">' + esc(r.who || "") + '</div>' +
      '<div class="mates">' + folks(r.mates, r.who) + '</div>' +
      '<div class="got">+' + clock(r.got) + (r.topped ? " 만점" : "") + '</div>' +
      move + '</div>';

  /* 공개는 서버 시계로 시작한다. left 를 보고 지금 어디쯤인지 맞춘다 */
  const began = Date.now() - (r.whole_ms + r.show_ms - r.left);
  if (film) clearInterval(film);
  const paint = () => {
    const t = Date.now() - began;
    if (t < r.whole_ms) return ink(r.whole, "#c62828");
    const k = Math.floor((t - r.whole_ms) / r.quick) % r.sheets.length;
    ink(r.whole, "#c62828", r.sheets[k], "#16171a");
  };
  paint();
  film = setInterval(paint, 80);
}

/* 닉네임에 뱃지를 달아 늘어놓는다. hero 는 방금 맞힌 사람 */
const bdg = p =>
  (p.hits ? '<i class="bdg hit">' + p.hits + '</i>' : "") +
  (p.miss ? '<i class="bdg miss">' + p.miss + '</i>' : "");
const folks = (list, hero) => (list || []).map(p =>
  '<span class="mate' + (hero && p.name === hero ? " hero" : "") + '">' +
  esc(p.name) + bdg(p) + '</span>').join('<span class="dot">·</span>');

/* ── 순위판 ───────────────────────────────────────────────────────── */
function ranks(){
  const v = V;
  const mine = v.team ? v.team.id : -1;
  const hot = v.reveal ? v.reveal.by : null;
  el("ranks").innerHTML = (v.board || []).map(t =>
    '<div class="rankrow' + (t.id === hot ? " hot" : t.id === mine ? " mine" : "") + '">' +
      '<span class="place">' + t.rank + '위</span>' +
      '<span class="tname">' + esc(t.name) +
        (t.full ? '<span class="pill">4인</span>' : "") + '</span>' +
      '<span class="mates">' + folks(t.mates) + '</span>' +
      '<span class="pts">' + clock(t.score) + '</span>' +
    '</div>').join("");
}

connect();
})();
</script>
</html>
