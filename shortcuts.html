function tracer(){
  const t=[],g={};
  return {t,g,stop:(line,loc,ret)=>t.push({line,depth:loc?1:0,g:{...g},loc:loc&&{...loc},ret})};
}
const DBG0=`number = 1
even_sum = 0
odd_sum = 0

while number <= 6:
    if number % 2 == 0:
        even_sum = even_sum + number
    else:
        odd_sum = odd_sum + number
    number = number + 1

if even_sum > odd_sum:
    print("짝수의 합이 더 큽니다")
else:
    print("홀수의 합이 더 큽니다")`;
const T0=(()=>{
  const {t,g,stop}=tracer();
  stop(1);g.number=1;stop(2);g.even_sum=0;stop(3);g.odd_sum=0;
  for(;;){
    stop(5);if(g.number>6)break;
    stop(6);
    if(g.number%2===0){stop(7);g.even_sum+=g.number}else{stop(9);g.odd_sum+=g.number}
    stop(10);g.number++;
  }
  stop(12);stop(13);t.out='짝수의 합이 더 큽니다';return t;
})();
const DBG1=`def square(n):
    result = n * n
    return result

total = 0
for i in range(1, 4):
    total = total + square(i)

print(total)`;

  const {t,g,stop}=tracer();
  stop(1);stop(5);g.total=0;
  for(let i=1;i<4;i++){stop(6);g.i=i;stop(7);const loc={n:i};stop(2,loc);loc.result=i*i;stop(3,loc);stop(7,null,true);g.total+=i*i}
  stop(6);stop(9);t.out='14';t.fn='square';return t;
})();

    r = n % 2
    return r == 0

count = 0
for x in range(3, 7):
    if is_even(x):

print(count)`;

  const {t,g,stop}=tracer();
  stop(1);stop(5);g.count=0;
  for(const x of [3,4,5,6]){stop(6);g.x=x;stop(7);const loc={n:x};stop(2,loc);loc.r=x%2;stop(3,loc);stop(7,null,true);if(x%2===0){stop(8);g.count++}}
  stop(6);stop(10);t.out='2';t.fn='is_even';return t;
})();

    const d=T[i].depth,lim=cmd==='over'?d:d-1;
    while(j<T.length&&T[j].depth>lim&&!hit(j))j++;
    if(cmd==='over'&&j<T.length&&j>i+1&&T[j].ret)j++; // 호출을 통째로 넘겼으면 '돌아온 순간'은 건너뜀
  }
  st.out='';
  if(j>=T.length){st.dbg=null;st.out=T.out;toast('프로그램이 끝까지 실행됐습니다.')}
  else st.dbg={i:j};
  return true;
}

// ───────── 실행·판정 ─────────
function run(cmd){
  const s=S[idx];if(st.done||s.info)return;
  if(cmd==='save'){st.dirty=false;toast('저장했습니다.')}
  else if(DBG.has(cmd)){
    if(!s.debug)return toast('디버깅 단축키는 뒤쪽 디버깅 단계에서 연습해요.');
    if(!dbg(cmd))return render();
  }
  else if(s.debug)return toast('디버깅 단계에서는 코드를 고치지 않아요.');
  else if(cmd==='rename')return openRn();
  else if(cmd==='undo'||cmd==='redo')hist(cmd);
  else edit(OPS[cmd]);
  st.last=cmd;render();check();
}
const norm=t=>t.split('\n').map(l=>l.trimEnd()).join('\n').trimEnd();
function ok(){
  const s=S[idx];
  return !s.info&&(s.target==null||norm(ta.value)===norm(s.target))&&(!s.save||!st.dirty)&&(!s.check||!!s.check(st,st.dbg&&T[st.dbg.i]));
}
function check(){if(!st.done&&ok())win()}
function win(){
  st.done=true;solved.add(idx);$('ok').classList.add('on');render();
  if(game){game.score++;S.splice(S.length-1,0,genProblem(game.ev))}const i=idx;timer=setTimeout(()=>go(i+1),game?400:1300);
}

// ───────── 화면 ─────────
function toast(m){
  const t=$('toast');t.textContent=m;t.classList.toggle('on',!!m);
  clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600);
}
function render(){
  const s=S[idx],v=ta.value,cl=lineOf(ta.selectionStart),P=st.dbg&&T[st.dbg.i];
  $('hl').innerHTML=hl(v)+'\n';
  $('gut').innerHTML=v.split('\n').map((_,n)=>`<div class="${st.bps.has(n+1)?'bp ':''}${P&&P.line===n+1?'at':''}"><b></b><u></u><span>${n+1}</span></div>`).join('');
  $('cur').style.top=cl*LH+'px';
  $('dl').style.display=P?'block':'none';if(P)$('dl').style.top=(P.line-1)*LH+'px';
  $('dot').hidden=!st.dirty;
  $('ed').classList.toggle('dbg',!!P);$('ed').classList.toggle('ok',st.done);
  const sec=(t,o)=>o&&Object.keys(o).length?`<h4>${t}</h4>`+Object.entries(o).map(([k,x])=>`<div><i class=v>${k}</i> = <i class=n>${x}</i></div>`).join(''):'';
  $('vars').innerHTML=P?sec(`지역 변수 (${T.fn})`,P.loc)+sec('전역 변수',P.g):'<p>디버깅 중이 아닙니다.</p>'+(st.out?`<h4 style="margin-top:10px">출력</h4><div>${st.out}</div>`:'');
  $('stl').textContent=P?`디버깅 중 · ${P.line}번 줄에서 멈춤`:'';
  $('str').textContent=`줄 ${cl+1} · Python`;
  $('prev').textContent=game?'✕ 그만두기':'← 이전';$('prev').disabled=!game&&!idx;
  $('next').disabled=idx===S.length-1||!((free&&!game)||s.info||solved.has(idx));
  $('reset').hidden=!!s.info;
  if(!game)$('prog').firstElementChild.style.width=idx/(S.length-1)*100+'%';
}
function load(i){
  clearTimeout(timer);idx=i;const s=S[i];
  document.body.className=(s.info?'info ':'')+(s.debug?'debug ':'')+(game?'game':'');
  $('count').textContent=game?`맞힌 문제 ${game.score}개`:`${i+1} / ${S.length}`;$('title').textContent=s.title;
  $('keys').innerHTML=(s.keys||[]).map(k=>'<span>'+k.split('+').map(x=>`<kbd>${x}</kbd>`).join(' + ')+'</span>').join('');
  $('desc').innerHTML=s.desc;
  $('goalbox').hidden=s.target==null;if(s.target!=null)$('goal').innerHTML=hl(s.target);
  closeRn();
  st={undo:(s.history||[]).map(v=>({v,s:0,e:0})),redo:[],dirty:!!s.dirty,bps:new Set(s.bps),dbg:null,last:'',done:false,out:''};
  T=s.trace||T1;
  set(s.code||'',0,0);(s.pre||[]).forEach(c=>dbg(c));st.last='';
  $('ok').classList.remove('on');toast('');
  render();if(!s.info)ta.focus();
}
function go(i){
  if(i<0||i>=S.length)return;
  if(i>idx&&!((free&&!game)||S[idx].info||solved.has(idx)))return;
  load(i);
}

// ───────── 게임: 종목별 시간 재기 ─────────
// 종목은 누적: 1종목 줄 옮기기 → 2종목 + 주석·들여쓰기 → 3종목 + 이름 바꾸기·저장
const GAME_MS=90000; // 한 게임 제한 시간(90초). 그동안 맞힌 문제 수가 점수
const EVENTS={
  1:{name:'1종목 · 줄 옮기기',keys:['Alt+↑','Alt+↓'],desc:'<p>줄 순서를 바로잡아 목표와 똑같이 만드세요.</p>'},
  2:{name:'2종목 · 주석과 들여쓰기',keys:['Alt+↑','Alt+↓','Ctrl+/','Tab','Shift+Tab'],desc:'<p>줄 순서, 주석, 들여쓰기를 목표와 똑같이 만드세요.</p>'},
  3:{name:'3종목 · 이름 바꾸기와 저장',keys:['Alt+↑','Alt+↓','Ctrl+/','Tab','Shift+Tab','F2','Ctrl+S'],desc:'<p>긴 변수 이름을 목표처럼 짧게 바꾸고, 다 고친 뒤 <b>저장까지</b> 해야 정답입니다.</p>'}
};
// 문제 재료. ren = [목표에 쓰는 짧은 이름, 3종목 시작 화면에 쓰는 긴 이름]
const POOL=[
{ren:['s','sum_of_numbers'],code:`s = 0
for i in range(1, 6):
    s = s + i
    print("더하는 중", i)
print("합계:", s)
print("계산 끝")`},
{ren:['a','age_of_user'],code:`a = 15
if a >= 14:
    print("가입할 수 있습니다")
    print("환영합니다")
else:
    print("가입할 수 없습니다")
print("나이:", a)`},
{ren:['c','countdown_number'],code:`c = 5
while c > 0:
    print(c)
    c = c - 1
print("발사!")
print("임무 완료")`},
{ren:['p','price_of_item'],code:`p = 1200
k = 3
print("가격:", p)
print("개수:", k)
if p * k > 3000:
    print("배송비 무료")
else:
    print("배송비 2500원")`},
{ren:['h','hour_of_day'],code:`h = 14
if h < 12:
    print("오전입니다")
else:
    print("오후입니다")
    print("점심은 드셨나요?")
print("현재", h, "시")`},
{ren:['e','even_count'],code:`e = 0
for i in range(1, 11):
    if i % 2 == 0:
        e = e + 1
        print(i, "짝수 발견")
print("짝수 개수:", e)`},
{ren:['w','password_try'],code:`w = 0
while w < 3:
    w = w + 1
    print(w, "번째 시도")
print("시도 횟수 초과")
print("잠시 후 다시 하세요")`},
{ren:['t','temperature'],code:`t = 31
if t >= 30:
    print("덥습니다")
    print("물을 자주 마시세요")
else:
    print("괜찮습니다")
print("기온:", t)`},
{ren:['m','money_left'],code:`m = 10000
m = m - 3500
print("빵을 샀습니다")
m = m - 1800
print("우유를 샀습니다")
print("남은 돈:", m)`},
{ren:['g','grade_score'],code:`g = 82
if g >= 90:
    print("A")
else:
    if g >= 80:
        print("B")
    else:
        print("C")
print("점수:", g)`}
];
const rnd=n=>Math.floor(Math.random()*n), any=a=>a[rnd(a.length)];
// 목표 코드를 단축키의 '반대 동작'으로 흐트러뜨려 시작 코드를 만든다.
// 흐트러뜨릴 때마다 되돌리는 조작을 sol에 적어 두므로, 모든 문제는 반드시 풀 수 있다(자체 점검에서 실제로 풀어 봄).
function genProblem(ev){
  for(;;){
    const sn=any(POOL),T=sn.code.split('\n'),L=[...T],sol=[],und=g=>sol.unshift(...g);
    const cm=l=>l.replace(/^(\s*)/,'$1# '),prints=A=>A.map((l,i)=>/^\s*print\(/.test(l)?i:-1).filter(i=>i>=0);
    const K=['indent','comment','move'];
    let kinds=ev===1?(rnd(2)?['move']:['move','move'])
      :ev===2?[['indent'],['comment'],['indent','comment']][rnd(3)].concat(rnd(2)?['move']:[])
      :[any(K)].concat(rnd(2)?[any(K)]:[]);
    kinds=[...new Set(kinds.filter(x=>x!=='move'))].concat(kinds.filter(x=>x==='move'));
    if(kinds.includes('comment')&&rnd(2)){ // 목표 쪽에 주석이 있는 변형: 학생이 주석을 걸어야 함
      const i=any(prints(T));T[i]=cm(T[i]);und([`L${i+1}`,'comment']);kinds=kinds.filter(x=>x!=='comment');
    }
    for(const kd of kinds){
      if(kd==='move'){
        const len=rnd(3)?1:2,a=rnd(L.length-len+1),b=a+len-1;let d=(rnd(3)+1)*(rnd(2)?1:-1);
        if(a+d<0||b+d>L.length-1)d=-d;
        if(a+d<0||b+d>L.length-1)continue;
        L.splice(a+d,0,...L.splice(a,len));
        und([len>1?`L${a+d+1}-${b+d+1}`:`L${a+d+1}`,...Array(Math.abs(d)).fill(d>0?'up':'down')]);
      }else if(kd==='indent'){
        const i=rnd(L.length);
        if(/^ {4}/.test(L[i])&&rnd(2)){L[i]=L[i].slice(4);und([`L${i+1}`,'indent'])}
        else{L[i]='    '+L[i];und([`L${i+1}`,'outdent'])}
      }else{
        const i=any(prints(L));L[i]=cm(L[i]);und([`L${i+1}`,'comment']);
      }
    }
    let code=L.join('\n');const target=T.join('\n');
    if(code===target)continue;
    if(ev===3){const [sh,lg]=sn.ren;code=code.replace(new RegExp(`(?<!\\w)${sh}(?!\\w)`,'g'),lg);sol.push(`N:${lg}>${sh}`,'save')}
    return {title:EVENTS[ev].name,keys:EVENTS[ev].keys,desc:EVENTS[ev].desc,code,target,save:ev===3,sol};
  }
}
let game=null;
function startGame(ev){
  game={ev,t0:Date.now(),score:0};solved.clear();$('timer').textContent=(GAME_MS/1000).toFixed(1)+'초';
  S=[genProblem(ev),{info:1,title:'',desc:''}]; // 문제는 맞힐 때마다 하나씩 뒤에 붙는다
  load(0);
}
function endGame(){
  game.end=Date.now();const n=game.score,ev=game.ev,key='vsc-best-score-'+ev;let best=0;
  try{best=+localStorage.getItem(key)||0;if(n>best)localStorage.setItem(key,n)}catch(e){}
  const r=S[S.length-1];
  r.title=EVENTS[ev].name+' 종료!';
  r.desc=`<p style="font-size:46px;margin:6px 0"><b>${n}문제</b></p>
<p>${!best?'첫 기록입니다.':n>best?`신기록! (이전 최고 ${best}문제)`:`내 최고 기록은 ${best}문제`}</p>
<p><button onclick="startGame(${ev})">같은 종목 다시</button>${ev<3?`<button onclick="startGame(${ev+1})">다음 종목 도전</button>`:''}<button onclick="quitGame()">처음으로</button></p>`;
  $('timer').textContent='0.0초';$('prog').firstElementChild.style.width='0%';
  load(S.length-1);
}
function quitGame(){game=null;S=LESSON;solved.clear();load(0)}
setInterval(()=>{
  if(!game||game.end)return;
  const left=GAME_MS-(Date.now()-game.t0);
  if(left<=0)return endGame();
  $('timer').textContent=(left/1000).toFixed(1)+'초';
  $('prog').firstElementChild.style.width=left/GAME_MS*100+'%';
},100);

// ───────── 입력 ─────────
function keyCmd(e){
  const k=e.key,c=e.ctrlKey,sh=e.shiftKey,a=e.altKey;
  if(k==='F5')return c&&sh?'restart':sh?'stop':'go';
  if(k==='F9')return 'bp';
  if(k==='F10')return 'over';
  if(k==='F11')return sh?'out':'into';
  if(k==='F2')return 'rename';
  if(k==='Tab')return sh?'outdent':'indent';
  if(a&&!c&&k==='ArrowUp')return 'up';
  if(a&&!c&&k==='ArrowDown')return 'down';
  // 한글 입력 상태에서도 잡히도록 글자 키는 e.code로 판별
  if(c&&e.code==='Slash')return 'comment';
  if(c&&e.code==='KeyS')return 'save';
  if(c&&e.code==='KeyZ')return sh?'redo':'undo';
  if(c&&e.code==='KeyY')return 'redo';
}
addEventListener('keydown',e=>{
  if(e.key==='Alt')return e.preventDefault(); // Alt만 눌렀다 떼면 브라우저 메뉴로 포커스가 가는 것을 막음
  const cmd=keyCmd(e),s=S[idx];
  if(rn){if(cmd&&cmd!=='undo'&&cmd!=='redo')e.preventDefault();return}
  if(s.info){if(cmd)e.preventDefault();if(e.key==='Enter'){e.preventDefault();go(idx+1)}return}
  if(!cmd)return;
  e.preventDefault();run(cmd);
},true);
addEventListener('keyup',e=>{if(e.key==='Alt')e.preventDefault()});
$('rni').addEventListener('keydown',e=>{
  if(e.isComposing)return;
  if(e.key==='Enter'){e.preventDefault();applyRn()}
  else if(e.key==='Escape'){closeRn();ta.focus()}
});
$('rni').addEventListener('blur',()=>{if(rn)closeRn()});

// 글자 입력 차단: 단축키를 써야만 풀리게 한다
const NOTYPE='글자 입력은 막혀 있어요. 단축키로 풀어 보세요!';
function revert(){
  if(ta.value!==st.text){const p=Math.min(ta.selectionStart,st.text.length);ta.value=st.text;ta.setSelectionRange(p,p)}
  toast(NOTYPE);
}
ta.addEventListener('beforeinput',e=>{e.preventDefault();if(!e.isComposing)toast(NOTYPE)});
ta.addEventListener('input',revert);           // 한글 조합 입력은 beforeinput으로 못 막아서 여기서 되돌림
ta.addEventListener('compositionend',revert);

document.addEventListener('selectionchange',()=>{if(document.activeElement===ta)render()});
document.addEventListener('mouseup',e=>{if(!rn&&!S[idx].info&&e.target.id!=='rni')ta.focus()});
$('prev').onclick=()=>game?quitGame():go(idx-1);
$('next').onclick=()=>go(idx+1);
$('reset').onclick=()=>load(idx);
addEventListener('beforeunload',e=>{if(solved.size&&idx<S.length-1){e.preventDefault();e.returnValue=''}});

// ───────── 자체 점검: 주소 끝에 ?test → 모든 문제를 모범 답안으로 풀어 보고 결과를 탭 제목에 표시 ─────────
function selfTest(){
  const SOL=[
    ['L2','down'],['L4','up','up','L3','down'],['L1','down','down','down'],['L1-2','down','down','down'],
    ['L2','indent'],['L3-4','indent'],['L3','indent','indent'],['L2-3','outdent'],['L3','outdent'],['L3','indent','L5','indent','L6','outdent'],
    ['L2','comment'],['L1-3','comment'],['L3-4','comment'],['L1','comment','L2','comment'],
    ['undo','undo'],['undo','undo','undo','undo'],['save'],
    ['L1','rename','R:s'],['L1','rename','R:n'],['L1','rename','R:w','L2','rename','R:h'],['W1:4','rename','R:i'],
    ['L1','comment','down','down','down','down','down','down','L3','indent','L6','outdent','L1','rename','R:p','save'],
    ['L1','down','down','down','down','L3-4','indent','L4','comment','L1','rename','R:s','save'],
    ['L2-3','outdent','L2','comment','L2','down','L2-3','down','down','L3','indent','L1','rename','R:c','save'],
    ['L6','bp'],['L6','bp','L10','bp'],['go'],['over'],['over','over','over'],['over','over'],['go'],['go','go','go','go'],['L6','bp','go'],['L12','bp','go','over'],['L10','bp','go','go','go','go'],
    ['over'],['into'],['into','over'],
    ['L8','bp','go'],['L2','bp','go','go','go','go'],['go','go','go','over','over'],['L3','bp','go','go','go']
  ];
  const pick=(a,b,col,sel)=>{
    const L=ta.value.split('\n'),o=k=>L.slice(0,k).join('\n').length+(k?1:0);
    ta.setSelectionRange(o(a)+col,sel?o(b)+L[b].length:o(a)+col);
  };
  const step=x=>{
    let m;
    if(m=x.match(/^L(\d+)(?:-(\d+))?$/))pick(m[1]-1,(m[2]||m[1])-1,0,!!m[2]);
    else if(m=x.match(/^W(\d+):(\d+)$/))pick(m[1]-1,m[1]-1,+m[2]);
    else if(m=x.match(/^R:(.+)/)){$('rni').value=m[1];applyRn()}
    else if(m=x.match(/^N:(\w+)>(\w+)$/)){const p=ta.value.search(new RegExp('(?<!\\w)'+m[1]+'(?!\\w)'));ta.setSelectionRange(p,p);run('rename');$('rni').value=m[2];applyRn()}
    else run(x);
  };
  let n=0;const fail=[];
  S.forEach((s,i)=>{
    if(s.info)return;
    load(i);if(ok())fail.push(i+' 시작부터 정답');
    const sol=SOL[n++]||[];
    for(const x of sol){
      if(st.done&&x!==sol[sol.length-1]){fail.push(i+' 답안 중간에 정답 처리');break}
      let m;
      if(m=x.match(/^L(\d+)(?:-(\d+))?$/))pick(m[1]-1,(m[2]||m[1])-1,0,!!m[2]);
      else if(m=x.match(/^W(\d+):(\d+)$/))pick(m[1]-1,m[1]-1,+m[2]);
      else if(m=x.match(/^R:(.+)/)){$('rni').value=m[1];applyRn()}
      else run(x);
    }
    if(!st.done)fail.push(i+' '+s.title);
  });
  // 게임 문제: 종목마다 300개씩 만들어 보고, 생성기가 적어 둔 풀이로 실제로 풀리는지 확인
  let gn=0;
  for(let ev=1;ev<=3&&!fail.length;ev++)for(let k=0;k<300;k++){
    const p=genProblem(ev);S=[p];load(0);
    if(ok()){fail.push('게임 '+ev+'종목: 시작부터 정답');break}
    p.sol.forEach(step);
    if(!st.done){fail.push('게임 '+ev+'종목 풀이 실패 '+p.sol.join(','));break}
    gn++;
  }
  S=LESSON;n+='+'+gn;
  document.title=fail.length?'TEST FAIL '+fail.join(' | '):'TEST OK '+n;
}

if(location.search.includes('test'))selfTest();
load(free?Math.max(0,Math.min(S.length-1,(+location.hash.slice(1)||1)-1)):0);
// 주소 끝에 ?game=2 처럼 붙이면 그 종목 게임으로 바로 시작
if(EVENTS[+new URLSearchParams(location.search).get('game')])startGame(+new URLSearchParams(location.search).get('game'));
</script>
