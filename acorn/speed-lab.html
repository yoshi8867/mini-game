<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>스피드 슬라이드 — 실험실</title>
<style>
  /* ys.css 에서 쓰는 값과 부품만 옮겨 왔다. 혼자 서는 한 장이라 딸린
     파일이 없다 — 보임새는 저쪽과 똑같이 맞춘다 */
  :root{
    --ink-900:#12100d; --ink-800:#1b1815; --ink-700:#221e1a;
    --line:#332e28; --line-2:#4a433a;
    --text:#ece7de; --dim:#8b8275;
    --gold:#e8b339; --gold-lit:#ffd873;
    --green:#3fb950; --green-lit:#8ae79a; --red:#e5534b;
    --r-md:10px; --slip:240ms; --ease:cubic-bezier(.34,1.4,.5,1);
    --fall:2000ms;
    --font:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",
      "맑은 고딕",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ink-900);color:var(--text);
    font:14.5px/1.6 var(--font);-webkit-tap-highlight-color:transparent}
  body{display:flex;flex-direction:column;align-items:center;
    gap:16px;padding:12px 10px 40px;min-height:100vh}

  /* ── 손잡이 줄 — 실험실이라 글자를 둔다. 게임 화면에는 안 둔다 ── */
  .bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;
    justify-content:center;color:var(--dim);font-size:12.5px;max-width:780px}
  .bar b{color:var(--text);font-weight:500}
  button{font:inherit;font-size:12.5px;color:var(--text);cursor:pointer;
    background:var(--ink-800);border:1px solid var(--line-2);
    border-radius:999px;padding:4px 13px}
  button.on{background:var(--gold);border-color:var(--gold);color:#2a1e06}
  input[type=range]{accent-color:var(--gold);width:110px;vertical-align:middle}
  select{font:inherit;font-size:12.5px;color:var(--text);background:var(--ink-800);
    border:1px solid var(--line-2);border-radius:999px;padding:3px 9px}

  /* ── 시계 ── */
  .clock{display:flex;gap:3px;width:min(520px,94vw)}
  .clock i{flex:1;height:16px;border-radius:3px;background:var(--ink-700);
    border:1px solid var(--line)}
  .clock i.on{background:linear-gradient(180deg,var(--green-lit),var(--green));
    border-color:var(--green);
    box-shadow:0 0 15px color-mix(in srgb,var(--green) 50%,transparent)}
  .clock i.on.warn{background:linear-gradient(180deg,
      color-mix(in srgb,var(--red) 55%,#fff),var(--red));
    border-color:var(--red);
    box-shadow:0 0 15px color-mix(in srgb,var(--red) 55%,transparent)}
  .clock.burn i{animation:blink .5s steps(1) infinite}

  /* ── 판 하나 — 3×3 짜리 ── */
  .bd{display:grid;gap:var(--g,3px);padding:var(--g,3px);
    background:var(--ink-900);border:1px solid var(--line);
    border-radius:var(--r-md);flex:none}
  .bd .px{position:relative;aspect-ratio:1;border-radius:4px;
    background:var(--ink-700) center/cover no-repeat}

  /* ── 윗줄 — 다람쥐마다 제 가운데 아홉 칸, 그 밑에 얼굴과 램프 ── */
  .seats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .seat{display:flex;flex-direction:column;align-items:center;gap:6px}
  .seat .bd.done{border-color:var(--green)}
  .who{display:flex;align-items:center;gap:7px}
  /* 다람쥐 얼굴 — ys.css 의 .ys-mug 와 같다 (도트 그림이라 뭉개면 안 된다) */
  .mug{width:26px;height:26px;border-radius:50%;flex:none;
    border:1px solid var(--line);background:var(--ink-800) center/cover no-repeat;
    image-rendering:pixelated}
  .mug.me{border-color:var(--green);
    box-shadow:0 0 9px color-mix(in srgb,var(--green) 45%,transparent)}
  /* 소통용 램프 — ys.css 의 .ys-dot 와 같다. 작은 원, 빛이 번진다 */
  .dot{width:14px;height:14px;border-radius:50%;flex:none;
    background:var(--ink-700);border:1px solid var(--line);
    transition:background 70ms linear,border-color 70ms linear,
      box-shadow 70ms linear}
  .dot.on{background:var(--green-lit);border-color:var(--green-lit);
    box-shadow:0 0 6px var(--green-lit),0 0 15px var(--green),
      0 0 32px color-mix(in srgb,var(--green) 85%,transparent)}
  .dot.on.warn{background:color-mix(in srgb,var(--red) 55%,#fff);
    border-color:var(--red);
    box-shadow:0 0 6px var(--red),0 0 15px var(--red),
      0 0 32px color-mix(in srgb,var(--red) 85%,transparent)}

  /* ── 아랫줄 — 과녁이 내 판 왼쪽에 선다 ── */
  .play{display:flex;gap:12px;align-items:center;justify-content:center}
  #goal{border-color:var(--gold);
    box-shadow:0 0 14px color-mix(in srgb,var(--gold) 18%,transparent)}

  /* ── 내 판 — 타일마다 제 자리를 transform 으로 잡는다 ── */
  .pit{position:relative;z-index:0;overflow:hidden;flex:none;
    padding:var(--g);border:1px solid var(--line);
    border-radius:var(--r-md);background:var(--ink-900)}
  #me{position:relative}
  .tl{position:absolute;left:0;top:0;width:var(--m);height:var(--m);
    border-radius:4px;background:var(--ink-700) center/cover no-repeat;
    transition:transform var(--slip) var(--ease);will-change:transform;
    cursor:pointer}
  .tl::after{content:"";position:absolute;inset:0;border-radius:4px;
    opacity:0;background:var(--green)}
  .pit.won .tl::after{animation:flash .42s steps(1) 3}
  .pit.done{border-color:var(--green)}
  .pit.done .tl::after{opacity:.16}
  .pit.miss{border-color:var(--red)}
  .pit.burn .tl::after{opacity:.5;background:var(--red);
    animation:blink .5s steps(1) infinite}
  @keyframes flash{0%{opacity:.72}50%{opacity:0}}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.18}}

  /* ── 액자 ──────────────────────────────────────────────────
     가운데 3×3 이 뚫린 **한 장**. 구멍은 가리개(mask)로 뚫는다 —
     네모 둘을 겹쳐 놓고 겹친 데를 빼면 가운데가 빈다. 가리개는
     바탕색만이 아니라 흐림까지 같이 자른다 (clip-path 는 못 한다).

     여러 장으로 나눠 붙이지 않는다. 흐림은 제 테두리 안쪽만 긁으므로
     나누면 맞닿은 선마다 이음매가 생기고, 움직이는 동안 저마다 따로
     반올림되어 판이 어긋나 보인다 */
  .frame{position:absolute;inset:0;pointer-events:none;
    background:rgba(18,16,13,.62);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    -webkit-mask-image:linear-gradient(#000,#000),linear-gradient(#000,#000);
    mask-image:linear-gradient(#000,#000),linear-gradient(#000,#000);
    -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
    -webkit-mask-composite:xor;mask-composite:exclude;
    transform:translateY(-101%);
    transition:transform var(--fall) cubic-bezier(.45,.05,.3,1)}
  .frame.down{transform:translateY(0)}

  /* 제출 — ys.css 의 .ys-btn.small 과 같다 */
  .go{width:96px;height:96px;border-radius:50%;border:2px solid var(--gold);
    background:radial-gradient(circle at 50% 38%,
      color-mix(in srgb,var(--gold) 13%,var(--ink-800)),
      color-mix(in srgb,var(--gold) 5%,var(--ink-900)));
    cursor:pointer;padding:0;transition:transform 80ms,border-color 180ms,
      background 180ms}
  .go:active{transform:scale(.955)}
  .go.cool{border-color:var(--line);cursor:default;
    background:radial-gradient(circle at 50% 38%,
      color-mix(in srgb,var(--ink-800) 70%,var(--line)),var(--ink-800))}
  .go.done{border-color:var(--green);cursor:default;
    background:radial-gradient(circle at 50% 38%,
      color-mix(in srgb,var(--green) 26%,var(--ink-800)),
      color-mix(in srgb,var(--green) 9%,var(--ink-900)))}

  .note{color:var(--dim);font-size:12.5px;max-width:580px;text-align:center}
  .note b{color:var(--text);font-weight:500}
</style>
</head>
<body>

<div class="bar">
  <span><b>인원</b>
    <button data-n="2">2</button><button data-n="3">3</button
    ><button data-n="4" class="on">4</button></span>
  <span><b>한 판</b> <input type="range" id="secs" min="20" max="180" step="10" value="100">
    <span id="secsN">100초</span></span>
  <span><b>타일</b> <input type="range" id="zoom" min="26" max="80" value="58">
    <span id="zoomN">58px</span></span>
  <span><b>미끄러짐</b> <input type="range" id="slip" min="60" max="600" step="10" value="240">
    <span id="slipN">240ms</span></span>
  <select id="ease">
    <option value="cubic-bezier(.34,1.4,.5,1)">살짝 튄다</option>
    <option value="cubic-bezier(.2,.9,.3,1)">빨리 붙고 천천히 멎는다</option>
    <option value="cubic-bezier(.4,0,.2,1)">부드럽게</option>
    <option value="cubic-bezier(.45,0,.55,1)">양끝이 무겁다</option>
  </select>
  <span><b>액자</b> <input type="range" id="fall" min="400" max="4000" step="100" value="2000">
    <span id="fallN">2000ms</span></span>
  <button id="copy">정한 값 베끼기</button>
  <button id="again">새 판</button>
  <button id="stir" class="on">남의 판 움직이기</button>
</div>

<div class="clock" id="clock"></div>

<div class="seats" id="seats"></div>
<div class="play">
  <div class="bd" id="goal"></div>
  <div class="pit" id="pit"><div id="me"></div><div class="frame" id="frame"></div></div>
</div>
<button class="go" id="go"></button>

<p class="note">빈칸과 <b>같은 줄</b>을 짚으면 그 사이가 통째로 밀린다.
  <b>가운데 3×3 만</b> 과녁(금빛 테)과 같으면 된다. 다 맞췄다 싶으면 제출.<br>
  윗줄은 다람쥐마다의 <b>가운데 아홉 칸</b>이다 — 녹색 테가 내 자리.
  진짜 판에서는 <b>파티가 다 맞춰야</b> 도토리다.</p>

   저쪽에 옮긴다. 파티가 다 맞춰야 끝나는 것과 남이 거드는 것은 여기서
   못 본다 — 자리와 손맛만 본다.
   ───────────────────────────────────────────────────────────────── */
(function () {
  "use strict";

  var SIDE = 5, CORE = 3, KINDS = 6, EACH = 4, CELLS = 25, MISS = 7;
  var HOLD = 2000, FLASH = 1260, TICKS = 30, WARN = 5, BURN = 2;
  var BLINK = 0.8;           /* 틀렸을 때 제 램프가 붉은 참 (초) */
  var FALL = 2000;

  var TILE = JSON.parse(document.getElementById("tiles").textContent);
  var FACE = JSON.parse(document.getElementById("mugs").textContent);

  var seatBox = document.getElementById("seats");
  var pit = document.getElementById("pit");
  var me = document.getElementById("me");
  var frame = document.getElementById("frame");
  var go = document.getElementById("go");
  var clock = document.getElementById("clock");
  var root = document.documentElement;

  var n = 4, limit = 100, z = 58, stir = true, pitch = 0;
  var goal = null, mine = [], boards = [], t0 = 0;
  var doneAt = 0, missAt = 0, burnAt = 0, busy = false, frames = 0;
  var slots = [], seats = [], goalPx = null;

  /* ── 문제집 ────────────────────────────────────────────────── */
  function rnd(k) { return Math.floor(Math.random() * k); }

  function makeGoal() {
    for (;;) {
      var g = [], cnt = {}, ok = true;
      for (var i = 0; i < 9; i++) { g.push(1 + rnd(KINDS)); }
      g.forEach(function (k) { cnt[k] = (cnt[k] || 0) + 1; });
      for (var k in cnt) { if (cnt[k] > EACH) { ok = false; } }
      if (ok) { return g; }
    }
  }
  function bag() {
    var out = [];
    for (var k = 1; k <= KINDS; k++) {
      for (var j = 0; j < EACH; j++) { out.push(k); }
    }
    for (var i = out.length - 1; i > 0; i--) {
      var q = rnd(i + 1), t = out[i]; out[i] = out[q]; out[q] = t;
    }
    out.splice(rnd(CELLS), 0, null);
    return out;
  }
  function core(list) {
    var off = (SIDE - CORE) / 2, out = [];
    for (var r = 0; r < CORE; r++) {
      for (var c = 0; c < CORE; c++) { out.push(list[(off + r) * SIDE + off + c]); }
    }
    return out;
  }
  function board(want) {
    for (;;) {
      var b = bag(), got = core(b), d = 0;
      for (var i = 0; i < 9; i++) { if (got[i] !== want[i]) { d++; } }
      if (d >= MISS) { return b; }
    }
  }
  /* 값과 타일을 **함께** 민다 — 타일이 제 조각을 쥐고 자리만 옮겨야
     CSS 가 미끄러뜨려 준다 (밀어내기 실험실과 같은 수다) */
  function push(list, els, to) {
    var b = list.indexOf(null);
    if (to === b || b < 0) { return false; }
    var br = (b / SIDE) | 0, bc = b % SIDE;
    var tr = (to / SIDE) | 0, tc = to % SIDE, s, c, r, i, j;
    if (br === tr) {
      s = tc > bc ? 1 : -1;
      for (c = bc; c !== tc; c += s) {
        i = br * SIDE + c; j = i + s;
        list[i] = list[j];
        if (els) { els[i] = els[j]; }
      }
    } else if (bc === tc) {
      s = tr > br ? 1 : -1;
      for (r = br; r !== tr; r += s) {
        i = r * SIDE + bc; j = (r + s) * SIDE + bc;
        list[i] = list[j];
        if (els) { els[i] = els[j]; }
      }
    } else { return false; }
    list[to] = null;
    if (els) { els[to] = null; }
    return true;
  }
  function solved() { return core(mine).join() === goal.join(); }

  /* ── 판 짓기 ───────────────────────────────────────────────── */
  function bd(box, unit, gap, el) {
    var b = el || document.createElement("div");
    b.className = "bd";
    b.style.cssText = "--g:" + gap + "px;width:" +
      (CORE * unit + (CORE + 1) * gap + 2) +
      "px;grid-template-columns:repeat(" + CORE + ",1fr)";
    b.innerHTML = "";
    var cells = [];
    for (var i = 0; i < CORE * CORE; i++) {
      var d = document.createElement("div");
      d.className = "px";
      b.appendChild(d);
      cells.push(d);
    }
    if (!el) { box.appendChild(b); }
    return {box: b, px: cells, was: ""};
  }
  function fill(one, list) {
    var key = list.join(",");
    if (key === one.was) { return; }
    one.was = key;
    for (var i = 0; i < one.px.length; i++) {
      var k = list[i];
      one.px[i].style.backgroundImage = k ? "url(" + TILE[k] + ")" : "";
    }
  }

  function place(quick) {
    var i;
    if (quick) {
      for (i = 0; i < slots.length; i++) {
        if (slots[i]) { slots[i].style.transition = "none"; }
      }
    }
    for (i = 0; i < slots.length; i++) {
      if (!slots[i]) { continue; }
      slots[i].style.transform = "translate(" + ((i % SIDE) * pitch) + "px," +
        (((i / SIDE) | 0) * pitch) + "px)";
    }
    if (quick) {
      void me.offsetWidth;                      /* 한 번 굳히고 되돌린다 */
      for (i = 0; i < slots.length; i++) {
        if (slots[i]) { slots[i].style.transition = ""; }
      }
    }
  }

  function build() {
    var W = Math.min(window.innerWidth - 20, 640);
    /* 윗줄 — 다람쥐 수만큼 3×3 이 선다 */
    var u = Math.max(11, Math.min(34, Math.floor((W - 20 * n) / (CORE * n))));
    /* 아랫줄 — 과녁(내 것의 0.6배)과 내 판이 한 줄에 들어가야 한다 */
    var m = Math.min(z, Math.floor((W - 52) / 6.8));
    var gu = Math.max(9, Math.round(m * 0.6)), g = 4;
    pitch = m + g;

    seatBox.innerHTML = "";
    seats = [];
    for (var k = 0; k < n; k++) {
      var seat = document.createElement("div");
      seat.className = "seat";
      var one = bd(seat, u, 3);
      var who = document.createElement("div");
      who.className = "who";
      var mug = document.createElement("div");
      mug.className = "mug" + (k === 0 ? " me" : "");
      mug.style.backgroundImage = FACE[k] ? "url(" + FACE[k] + ")" : "";
      var dot = document.createElement("div");
      dot.className = "dot";
      who.appendChild(mug);
      who.appendChild(dot);
      seat.appendChild(who);
      seatBox.appendChild(seat);
      one.dot = dot;
      seats.push(one);
    }

    goalPx = bd(null, gu, 3, document.getElementById("goal"));

    pit.style.setProperty("--g", g + "px");
    pit.style.setProperty("--m", m + "px");
    var span = SIDE * m + (SIDE - 1) * g;
    me.style.cssText = "width:" + span + "px;height:" + span + "px";

    /* 액자 구멍 — 가리개 네모 둘을 겹쳐 놓고 겹친 데를 뺀다 */
    var off = (SIDE - CORE) / 2;
    var at = g + off * pitch - 1;
    var hole = CORE * m + (CORE - 1) * g + 2;
    frame.style.webkitMaskSize = frame.style.maskSize =
      "100% 100%, " + hole + "px " + hole + "px";
    frame.style.webkitMaskPosition = frame.style.maskPosition =
      "0 0, " + at + "px " + at + "px";

    me.innerHTML = "";
    slots = [];
    for (var i = 0; i < CELLS; i++) {
      if (mine[i] == null) { slots.push(null); continue; }
      var el = document.createElement("div");
      el.className = "tl";
      el.style.backgroundImage = "url(" + TILE[mine[i]] + ")";
      me.appendChild(el);
      slots.push(el);
    }
    place(true);

    clock.innerHTML = "";
    for (i = 0; i < TICKS; i++) { clock.appendChild(document.createElement("i")); }
  }

  /* ── 한 판 ─────────────────────────────────────────────────── */
  function serve() {
    goal = makeGoal();
    mine = board(goal);
    boards = [];
    for (var k = 1; k < n; k++) { boards.push(board(goal)); }
    t0 = Date.now() / 1000;
    doneAt = missAt = burnAt = 0;
    busy = false;
    frame.classList.remove("down");
    pit.classList.remove("won");
    build();
    draw();
  }

  function left() {
    return Math.max(0, limit - ((doneAt || Date.now() / 1000) - t0));
  }
  function open_() {
    return !doneAt && !burnAt && !busy &&
      !(missAt && Date.now() / 1000 - missAt < BURN);
  }

  function draw() {
    fill(goalPx, goal);
    /* 0번이 나다 — 내 가운데 아홉 칸도 윗줄에 같이 선다 */
    for (var k = 0; k < seats.length; k++) {
      fill(seats[k], k === 0 ? core(mine) : core(boards[k - 1]));
      seats[k].box.classList.toggle("done", k === 0 && !!doneAt);
      /* 녹색은 맞춘 것, 적색은 **방금 틀렸다**는 한 번의 점등이다 */
      seats[k].dot.className = "dot" + (k !== 0 ? ""
        : doneAt ? " on"
        : (missAt && Date.now() / 1000 - missAt < BLINK) ? " on warn" : "");
    }
    pit.classList.toggle("done", !!doneAt);
    pit.classList.toggle("miss", !!missAt && !doneAt);
    pit.classList.toggle("burn", !!burnAt);
    go.className = "go" + (doneAt ? " done" : open_() ? "" : " cool");

    var on = Math.ceil(left() / limit * TICKS);
    for (var i = 0; i < clock.children.length; i++) {
      clock.children[i].className = i < on ? "on" + (on <= WARN ? " warn" : "") : "";
    }
    clock.classList.toggle("burn", !!burnAt);
  }

  function loop() {
    frames++;
    var now = Date.now() / 1000;
    if (!doneAt && !burnAt && left() <= 0) { burnAt = now; }
    if (burnAt && now - burnAt >= BURN) { serve(); }
    if (missAt && now - missAt >= BURN) { missAt = 0; }
    /* 남의 판이 저절로 섞인다 — 가운데 아홉 칸이 어떻게 읽히나 보려는 것 */
    if (stir && !burnAt && frames % 70 === 0) {
      for (var k = 0; k < boards.length; k++) {
        var b = boards[k].indexOf(null);
        push(boards[k], null, Math.random() < .5
          ? ((b / SIDE) | 0) * SIDE + rnd(SIDE) : rnd(SIDE) * SIDE + (b % SIDE));
      }
    }
    draw();
    requestAnimationFrame(loop);
  }

  /* ── 손 ────────────────────────────────────────────────────── */
  me.addEventListener("pointerdown", function (e) {
    var t = e.target.closest(".tl");
    if (!t || !open_()) { return; }
    e.preventDefault();
    var to = slots.indexOf(t);
    if (to < 0 || !push(mine, slots, to)) { return; }
    place(false);
  });

  /* 내려오고(2초) · 멎어 있고(2초) · 그제야 가린 값이 점멸한다.
     맞았으면 **액자는 그대로 덮여 있다** — 거기서 끝이라 판을 도로
     보여 줄 까닭이 없다. 틀렸으면 올라가고 다시 민다 */
  go.addEventListener("click", function () {
    if (!open_()) { return; }
    busy = true;
    frame.classList.add("down");
    setTimeout(function () {
      var ok = solved();
      if (ok) { doneAt = Date.now() / 1000; } else { missAt = Date.now() / 1000; }
      if (ok) { pit.classList.add("won"); }    /* 틀린 것은 램프가 말한다 */
      draw();
      setTimeout(function () {
        pit.classList.remove("won");
        if (ok) { busy = false; draw(); return; }   /* 덮인 채로 둔다 */
        frame.classList.remove("down");
        setTimeout(function () {
          busy = false;
          draw();
        }, FALL);
      }, FLASH);
    }, FALL + HOLD);
  });

  /* ── 손잡이 ────────────────────────────────────────────────── */
  document.querySelectorAll("[data-n]").forEach(function (b) {
    b.onclick = function () {
      document.querySelectorAll("[data-n]").forEach(function (o) {
        o.classList.toggle("on", o === b);
      });
      n = +b.dataset.n;
      serve();
    };
  });
  document.getElementById("secs").oninput = function () {
    limit = +this.value;
    document.getElementById("secsN").textContent = limit + "초";
    t0 = Date.now() / 1000;
  };
  document.getElementById("zoom").oninput = function () {
    z = +this.value;
    document.getElementById("zoomN").textContent = z + "px";
    build();
    draw();
  };
  document.getElementById("slip").oninput = function () {
    root.style.setProperty("--slip", this.value + "ms");
    document.getElementById("slipN").textContent = this.value + "ms";
  };
  document.getElementById("ease").onchange = function () {
    root.style.setProperty("--ease", this.value);
  };
  document.getElementById("fall").oninput = function () {
    FALL = +this.value;
    root.style.setProperty("--fall", FALL + "ms");
    document.getElementById("fallN").textContent = FALL + "ms";
  };
  document.getElementById("again").onclick = serve;
  document.getElementById("stir").onclick = function () {
    stir = !stir;
    this.classList.toggle("on", stir);
  };

  /* 돌려 보고 정한 값을 통째로 베낀다 — 그대로 저쪽에 옮기면 된다 */
  document.getElementById("copy").onclick = function () {
    var ease = document.getElementById("ease");
    var slip = document.getElementById("slip").value;
    var said = "스피드 슬라이드 — 실험실에서 정한 값\n" +
      "인원 " + n + "  한 판 " + limit + "초  타일 " + z + "px\n" +
      "미끄러짐 " + slip + "ms  " + ease.options[ease.selectedIndex].text + "\n" +
      "액자 " + FALL + "ms (내려오고 올라가는 참)\n\n" +
      "server/speed.py    LIMIT = " + limit + ".0\n" +
      "static/speed.html  var SLIP = " + slip + ";\n" +
      "                   var EASE = \"" + ease.value + "\";\n" +
      "                   var FALL = " + FALL + ";  var RISE = " + FALL + ";\n" +
      "                   .frame transition " + FALL + "ms\n";
    var b = this;
    function done(ok) {
      b.textContent = ok ? "베꼈다" : "안 된다 — 직접 고르시라";
      setTimeout(function () { b.textContent = "정한 값 베끼기"; }, 1600);
    }
    if (navigator.clipboard) {
      navigator.clipboard.writeText(said).then(function () { done(1); },
                                              function () { done(0); });
      return;
    }
    var ta = document.createElement("textarea");   /* https 가 아니면 이 길로 */
    ta.value = said;
    ta.style.cssText = "position:fixed;left:-9999px";
    document.body.appendChild(ta);
    ta.select();
    try { done(document.execCommand("copy")); } catch (e) { done(0); }
    document.body.removeChild(ta);
  };

  addEventListener("resize", function () { build(); draw(); });

  serve();
  loop();
})();
</script>
</body>
</html>
