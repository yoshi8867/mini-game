<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>도토리 — 양팔 저울 실험실</title>
<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css");

  /* 혼자 서는 한 장이다 — ys.css 를 걸지 않고 **쓰는 값만 베껴 둔다.**
     ys.css 가 바뀌면 이 토막도 손으로 맞춘다 */
  :root{
    --ink-900:#12100d; --ink-800:#1b1815; --ink-700:#221e1a;
    --line:#332e28;    --line-2:#4a433a;
    --text:#ece7de;    --dim:#8b8275;
    --gold:#e8b339;    --gold-lit:#ffd873;
    --green:#3fb950;   --red:#e5534b;    --on-gold:var(--gold-lit);
    --t-xs:11.5px; --t-sm:12.5px; --t-md:14.5px;
    --s-2:8px; --s-3:12px; --s-4:16px; --s-6:24px;
    --r-sm:5px; --r-md:10px;
    --m-state:180ms ease;
    --font:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",
      "맑은 고딕",system-ui,sans-serif;

    /* 그림자놀이의 흰 판 — 저울과 추는 여기 비치는 **먹빛 실루엣**이다.
       ys.css 의 --paper(누런 종이)·--cast(먹) 와 같은 자리에 서는 색이되,
       저울 판은 누런 기 없이 흰 것으로 한다 */
    --sheet:#ffffff;
    --cast:#12100d;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{margin:0;background:var(--ink-900);color:var(--text);
    font:var(--t-md)/1.6 var(--font);-webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    display:grid;grid-template-columns:1fr 330px;min-height:100vh}
  @media (max-width:1100px){body{grid-template-columns:1fr}}

  .stage{padding:var(--s-4);display:flex;flex-direction:column;
    gap:var(--s-4);align-items:center}
  .panel{border-left:1px solid var(--line);background:var(--ink-800);
    padding:var(--s-4);display:flex;flex-direction:column;gap:var(--s-2);
    overflow:auto;max-height:100vh;position:sticky;top:0}
  @media (max-width:1100px){.panel{position:static;max-height:none;
    border-left:0;border-top:1px solid var(--line)}}

  h2{font-size:var(--t-sm);color:var(--dim);margin:var(--s-3) 0 0;
    letter-spacing:.08em;text-transform:uppercase;font-weight:600}
  .row{display:flex;align-items:center;gap:var(--s-2)}
  .row label{flex:0 0 92px;font-size:var(--t-sm);color:var(--dim)}
  .row input[type=range]{flex:1;accent-color:var(--gold);min-width:0}
  .row output{flex:0 0 46px;text-align:right;font-size:var(--t-sm);
    font-variant-numeric:tabular-nums}
  select,button.plain{background:var(--ink-700);color:var(--text);
    border:1px solid var(--line-2);border-radius:var(--r-sm);
    padding:6px 10px;font:var(--t-sm) var(--font);cursor:pointer}
  button.plain:hover{border-color:var(--gold)}
  textarea{width:100%;height:110px;background:var(--ink-900);color:var(--dim);
    border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--s-2);
    font:11px/1.5 ui-monospace,Consolas,monospace;resize:vertical}
  .hint{font-size:var(--t-xs);color:var(--dim);line-height:1.6}

  /* ── 1행 — 정답 칸과 제출 ──────────────────────────────────────
     슬롯을 오르내리는 것은 ys.css 의 .ys-tri — 「수를 올리고 내리는
     자리」가 세모 버튼이 서는 두 자리 중 하나다. 제출은 .ys-btn */
  .top{display:flex;align-items:center;gap:var(--s-6);flex-wrap:wrap;
    justify-content:center}
  .answers{display:flex;flex-direction:column;gap:var(--s-3)}
  .ans{display:flex;align-items:center;gap:var(--s-3)}
  /* 「그릇 = 슬롯」 — 통째로 흰 판 위에 올라간다 */
  .eqrow{background:var(--sheet);border-radius:var(--r-md);
    padding:12px 16px;display:flex;align-items:center;gap:14px}
  .eqrow img{display:block}
  /* 슬롯 — 들창(.win) 하나만 보이고 띠(.strip)가 위아래로 흐른다.
     칸과 칸 사이에는 가로 칸막이가 있어, 넘어가는 동안 줄이 지나간다 */
  .win{background:var(--sheet);border-radius:var(--r-sm);overflow:hidden;
    border:2px solid var(--cast);position:relative}
  .strip{will-change:transform}
  .cell{border-bottom:2px solid var(--cast);display:flex;
    align-items:center;justify-content:center}
  .lift{display:flex;flex-direction:column;gap:2px}

  .ys-tri{padding:0;border:none;background:none;color:var(--gold);
    cursor:pointer;display:block;
    transition:transform 80ms,color var(--m-state)}
  .ys-tri svg{display:block;width:100%;height:100%;overflow:visible;
    transition:transform var(--m-state)}
  .ys-tri polygon{fill:color-mix(in srgb,var(--gold) 9%,var(--ink-900));
    stroke:currentColor;stroke-width:2;stroke-linejoin:round;
    vector-effect:non-scaling-stroke;transition:fill var(--m-state)}
  .ys-tri:active{transform:scale(.94);color:var(--on-gold)}
  .ys-tri:active polygon{fill:color-mix(in srgb,var(--gold) 28%,var(--ink-800))}
  .ys-tri.down svg{transform:rotate(180deg)}

  .ys-btn{width:132px;height:132px;border-radius:50%;
    border:2px solid var(--gold);color:var(--gold);cursor:pointer;
    background:radial-gradient(circle at 50% 38%,
      color-mix(in srgb,var(--gold) 13%,var(--ink-800)),
      color-mix(in srgb,var(--gold) 5%,var(--ink-900)));
    display:flex;align-items:center;justify-content:center;
    transition:transform 80ms,border-color var(--m-state),
      background var(--m-state),color var(--m-state)}
  .ys-btn:active{transform:scale(.955)}
  .ys-btn.cool{border-color:var(--line);color:var(--dim);cursor:default;
    background:radial-gradient(circle at 50% 38%,
      color-mix(in srgb,var(--ink-800) 70%,var(--line)),var(--ink-800))}
  .ys-btn.done{border-color:var(--green);color:var(--green)}
  .ys-btn.bad{border-color:var(--red);color:var(--red)}

  /* ── 2행 — 저울. **흰 판에 검은 실루엣** ────────────────────── */
  svg.scale{display:block;width:min(100%,900px);height:auto}
  .beam,.sling{transition:transform var(--sway,760ms) cubic-bezier(.22,1.5,.36,1)}
  .wt{cursor:pointer}
  .wt.locked{cursor:default;opacity:.45}
  .wt.sel>.body{stroke:var(--gold);stroke-width:4}
  @keyframes drop{from{transform:translateY(-70px);opacity:0}}
  @keyframes rise{to{transform:translateY(-70px);opacity:0}}
  .drop{animation:drop 420ms cubic-bezier(.3,1.3,.5,1)}
  .rise{animation:rise 360ms ease-in forwards}
  .go{cursor:pointer}
  .go:hover>path{fill:var(--gold-lit)}

  /* ── 3행 — 개별 공간. 추가 검은 실루엣이니 바탕도 흰 판이다 ─── */
  .spaces{display:flex;gap:var(--s-4);flex-wrap:wrap;justify-content:center}
  .me{display:flex;flex-direction:column;align-items:center;gap:6px}
  .space{border:3px solid transparent;border-radius:14px;
    background:var(--sheet);display:flex;align-items:center;
    justify-content:center;gap:6px;padding:8px;position:relative}
  .space.mine{border-color:var(--gold)}        /* 내 칸 — 내가 손대는 곳 */

  /* 프사 — ys.css 의 .ys-mug 를 그대로 베꼈다. 도트 그림이라 뭉개면
     안 되고, **내 다람쥐만 녹색 테두리**다 (녹색 = 여기 있다 · 나) */
  .pfp{border-radius:50%;flex:none;border:2px solid var(--line);
    background:var(--ink-800) center/cover no-repeat;image-rendering:pixelated}
  .pfp.me{border-color:var(--green);
    box-shadow:0 0 9px color-mix(in srgb,var(--green) 45%,transparent)}

  .chk{font-size:var(--t-xs);line-height:1.75}
  .pass{color:var(--green)} .fail{color:var(--red)}
</style>
</head>
<body>

<div class="stage">
  <div class="top">
    <div class="answers" id="answers"></div>
    <button class="ys-btn" id="submit"></button>
  </div>
  <div id="board"></div>
  <div class="spaces" id="spaces"></div>
</div>

<div class="panel">
  <h2>판</h2>
  <div class="row">
    <label>다람쥐</label>
    <select id="n"><option>2</option><option>3</option><option selected>4</option></select>
    <label style="flex:0 0 40px">나는</label>
    <select id="me"></select>
  </div>
  <div class="row">
    <label>손대기</label>
    <select id="god">
      <option value="1">다 만진다 (혼자 풀어 보기)</option>
      <option value="0">제 추만</option>
    </select>
  </div>
  <div class="row">
    <button class="plain" id="again">새 문제</button>
    <button class="plain" id="peek">답 보기</button>
    <span class="hint" id="answer"></span>
  </div>

  <h2>저울</h2>
  <div id="k1"></div>
  <h2>추 · 칸</h2>
  <div id="k2"></div>

  <h2>삼진법 값</h2>
  <div class="hint">고르는 판에서 낸 JSON 을 붙여 넣는다</div>
  <textarea id="glyph"></textarea>
  <div class="row"><button class="plain" id="apply">먹인다</button>
    <button class="plain" id="dump">지금 값</button></div>

  <h2>검산</h2>
  <div class="chk" id="chk"></div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const SHEET = "#ffffff", CAST = "#12100d";     /* 흰 판 · 먹빛 실루엣 */

/* ══ 삼진법 표기 — 고르는 판(/lab/ternary)에서 가져왔다 ═══════════ */
const G = { w:38, t:3, gap:5, dotD:14, dotG:9,
            waveN:3, waveA:4, snailD:26, turns:2,
            triW:24, triH:14,
            ink:"#ece7de", fill:false, cap:"round", big:"snail" };
const MAX = 40;
const tri = n => { const d=[]; for(let i=0,m=n;i<4;i++,m=Math.floor(m/3)) d.push(m%3); return d; };
const rowsOf = n => { const d=tri(n), o=[];
  if (d[0]) o.push({k:"dot", n:d[0]});
  for (let i=0;i<d[1];i++) o.push({k:"bar"});
  for (let i=0;i<d[2];i++) o.push({k:"wave"});
  if (d[3]) o.push({k:"tri", n:d[3]});
  return o; };
const bigW = () => G.big === "snail" ? G.snailD : G.triW;
const bigH = () => G.big === "snail" ? G.snailD : G.triH;
const rowH = r => r.k==="dot" ? G.dotD : r.k==="bar" ? G.t
                : r.k==="wave" ? G.waveA*2+G.t : bigH();
const rowW = r => r.k==="dot" ? r.n*G.dotD+(r.n-1)*G.dotG
                : r.k==="tri" ? r.n*bigW()+(r.n-1)*G.dotG : G.w;
function snail(cx, cy, R, turns){
  const end = turns*2*Math.PI, n = Math.ceil(turns*48);
  let d = "";
  for (let i=0;i<=n;i++){ const th=end*i/n, r=(R-G.t/2)*th/end;
    d += (i?" L ":"M ")+(cx+r*Math.cos(th)).toFixed(2)+" "+(cy+r*Math.sin(th)).toFixed(2); }
  return d;
}
function drawRow(r, cx, y, ink){
  const s = `stroke="${ink}" stroke-width="${G.t}" fill="none" stroke-linecap="${G.cap}"`;
  if (r.k === "dot"){
    const w = rowW(r), R = G.dotD/2, g = [];
    for (let i=0;i<r.n;i++){ const x = cx-w/2+R+i*(G.dotD+G.dotG);
      g.push(G.fill ? `<circle cx="${x}" cy="${y+R}" r="${R}" fill="${ink}"/>`
                    : `<circle cx="${x}" cy="${y+R}" r="${R-G.t/2}" ${s}/>`); }
    return g.join("");
  }
  if (r.k === "bar"){ const y0 = y+G.t/2;
    return `<line x1="${cx-G.w/2}" y1="${y0}" x2="${cx+G.w/2}" y2="${y0}" ${s}/>`; }
  if (r.k === "wave"){
    const half = G.w/(2*G.waveN), y0 = y+rowH(r)/2;
    let p = `M ${cx-G.w/2} ${y0}`;
    for (let i=0;i<G.waveN*2;i++) p += ` q ${half/2} ${(i%2?2:-2)*G.waveA} ${half} 0`;
    return `<path d="${p}" ${s}/>`;
  }
  const w = rowW(r), bw = bigW(), g = [];
  for (let i=0;i<r.n;i++){ const x = cx-w/2+i*(bw+G.dotG);
    g.push(G.big === "snail"
      ? `<path d="${snail(x+bw/2, y+bw/2, bw/2, G.turns)}" ${s}/>`
      : `<polygon points="${x},${y} ${x+bw},${y} ${x+bw/2},${y+G.triH}" fill="${ink}"/>`); }
  return g.join("");
}
/* 글리프 한 벌. 칠할 빛깔은 **얹히는 바탕**이 정한다 —
   검은 추 위에서는 희게, 흰 슬롯 안에서는 먹빛으로 */
function glyph(n, ink){
  const rows = rowsOf(n);
  if (!rows.length) return { w: G.w, h: G.dotD, body: "" };
  const w = Math.max(...rows.map(rowW));
  const h = rows.reduce((a,r)=>a+rowH(r),0) + (rows.length-1)*G.gap;
  let y = 0, body = "";
  for (const r of rows){ body += drawRow(r, w/2, y, ink); y += rowH(r)+G.gap; }
  return { w, h, body };
}
function glyphBox(){
  let w = 0, h = 0;
  for (let n=0;n<=MAX;n++){ const g = glyph(n, CAST); w = Math.max(w,g.w); h = Math.max(h,g.h); }
  return { w, h };
}

/* ══ 문제 ════════════════════════════════════════════════════════ */
const UNITS = [1, 3, 9, 27];
const SUMS = (() => { const s = new Set([0]);
  for (const u of UNITS) for (const x of [...s]) s.add(x+u);
  return s; })();
const POOL = Array.from({length:30}, (_,i)=>i+11).filter(n => !SUMS.has(n));
function newQuiz(){ return [pick(POOL)]; }    /* 맞힐 것은 하나다 */

/* ══ 나눠 주기 ═══════════════════════════════════════════════════ */
function deal(n){
  let own;
  for (;;){
    own = Array.from({length:n}, () => []);
    for (const u of UNITS) own[rnd(n)].push(u);
    if (own.every(a => a.length)) break;
  }
  /* 퀴즈 추는 **추가 하나뿐인 다람쥐**가 든다. 그런 다람쥐가 없으면
     (두 마리가 둘씩 나눠 가진 때) 아무나 든다 */
  const thin = own.map((a,i)=>[a.length,i]).filter(([c])=>c===1).map(([,i])=>i);
  return { own, quizOwner: [thin.length ? pick(thin) : rnd(n)] };
}

/* ══ 판의 상태 ═══════════════════════════════════════════════════ */
const S = {
  n: 4, me: 0, god: true, quiz: newQuiz(), cup: 0, deal: null,
  at: {}, slot: [0], sel: null, verdict: ""
};
const ALL = () => [...UNITS.map(u=>"u"+u), "q0"];
const massOf = k => k[0]==="u" ? +k.slice(1) : S.quiz[+k[1]];
/* 실험실에서는 혼자 풀어 봐야 하니 넷의 추를 다 만지게 열어 둔다.
   참말 게임에서는 제 추만 제가 옮긴다 */
const canTouch = k => S.god || ownerOf(k) === S.me;
const ownerOf = k => k[0]==="u"
  ? S.deal.own.findIndex(a => a.includes(+k.slice(1)))
  : S.deal.quizOwner[+k[1]];
function reset(keepQuiz){
  S.deal = deal(S.n);
  if (!keepQuiz){ S.quiz = newQuiz(); S.cup = rnd(CUPS.length); }
  S.at = {}; for (const k of ALL()) S.at[k] = "home";
  S.slot = [0]; S.sel = null; S.verdict = "";
  if (S.me >= S.n) S.me = 0;
}

/* ══ 손잡이 ══════════════════════════════════════════════════════ */
const K1 = [
  ["beam",  "들보 길이", 240, 700, 520, "px"],
  ["col",   "기둥 키",    90, 300, 190, "px"],
  ["finial","꼭대기 장식", 30, 120, 62, "px"],
  ["shaft", "기둥 굵기",  12,  56, 26, "px"],
  ["base",  "받침 너비",  40, 180, 96, "px"],
  ["chain", "사슬 길이",  40, 200,  96, "px"],
  ["link",  "사슬 고리",   5,  18,   9, "px"],
  ["pan",   "접시 너비",  60, 220, 130, "px"],
  ["panD",  "접시 깊이",   4,  60,  18, "px"],
  ["panT",  "접시 테",     2,  10,   3, "px"],
  ["tilt0", "최소 기울기", 2,  14,   6, "°"],
  ["tilt1", "최대 기울기", 6,  26,  15, "°"],
  ["span",  "다 기우는 차", 4, 60,  20, ""],
  ["sway",  "흔들림",    200, 1600, 760, "ms"],
];
const K2 = [
  ["wtW",   "추 너비",    28, 110, 62, "px"],
  ["wtH",   "추 키",      28, 120, 64, "px"],
  ["arrow", "화살표",     24, 130, 76, "px"],
  ["slotW", "슬롯 너비",  40, 180, 92, "px"],
  ["cupH",  "그릇 크기",  30, 140, 72, "px"],
  ["eq",    "같음표",     14,  70, 34, "px"],
  ["spin",  "슬롯 넘김",  80, 600,220, "ms"],
  ["pfp",   "프사",       24,  72, 40, "px"],
  ["spaceW","개별 공간",  90, 320,170, "px"],
];
const V = {};
const mkKnobs = (el, list) => el.innerHTML = list.map(([k,name,lo,hi,def,unit]) =>
  `<div class="row"><label>${name}</label>
   <input type="range" id="k_${k}" min="${lo}" max="${hi}" value="${def}">
   <output id="o_${k}">${def}${unit}</output></div>`).join("");
mkKnobs($("k1"), K1); mkKnobs($("k2"), K2);
function readKnobs(){
  for (const [k,,,,,unit] of [...K1, ...K2]){
    V[k] = +$("k_"+k).value; $("o_"+k).textContent = V[k]+unit;
  }
  if (V.tilt1 < V.tilt0) V.tilt1 = V.tilt0;
  document.documentElement.style.setProperty("--sway", V.sway+"ms");
}

/* ══ 추 하나 — 옆에서 본 사다리꼴. **검은 실루엣**이다 ══════════ */
function weightSVG(k, cls){
  const W = V.wtW, H = V.wtH, lip = W*0.17, m = massOf(k);
  let inner;
  if (k[0] === "u"){
    const g = glyph(m, SHEET);                  /* 먹빛 추 위라 희게 적는다 */
    const z = Math.min(1, (W-14)/g.w, (H-16)/Math.max(g.h,1));
    inner = `<g transform="translate(${W/2 - g.w*z/2} ${H/2 - g.h*z/2}) scale(${z})">${g.body}</g>`;
  } else {
    /* 퀴즈 추는 사다리꼴을 쓰지 않는다. 그릇 그림이 곧 추다 */
    return `<g class="wt ${cls}" data-k="${k}">`
         + `<rect class="body" x="1" y="1" width="${W-2}" height="${H-2}" rx="4"
            fill="none" stroke="none"/>`
         + `<image href="${CUPS[S.cup]}" x="0" y="0" width="${W}" height="${H}"
            preserveAspectRatio="xMidYMax meet"/></g>`;
  }
  return `<g class="wt ${cls}" data-k="${k}">`
       + `<polygon class="body" points="${lip},2 ${W-lip},2 ${W-1},${H-2} 1,${H-2}"
          fill="${CAST}" stroke="none"/>${inner}</g>`;
}

/* ══ 진짜 화살표 — 자루와 머리가 달렸다. 세모 버튼과 다른 것이다 ══ */
function arrowPath(A){
  const w = A*0.17, head = A*0.40, hw = A*0.34;
  return `M ${-w} ${-A/2} L ${w} ${-A/2} L ${w} ${A/2-head}`
       + ` L ${hw} ${A/2-head} L 0 ${A/2} L ${-hw} ${A/2-head}`
       + ` L ${-w} ${A/2-head} Z`;
}
function goArrow(where, x, y){
  if (!S.sel || S.at[S.sel] === where) return "";
  if (!canTouch(S.sel)) return "";
  return `<g class="go" data-go="${where}" transform="translate(${x} ${y})">
            <path d="${arrowPath(V.arrow)}" fill="var(--gold)"/></g>`;
}

/* ══ 저울 ════════════════════════════════════════════════════════ */
const sideMass = s => ALL().filter(k => S.at[k] === s).reduce((a,k)=>a+massOf(k), 0);
function tiltDeg(){
  const d = sideMass("R") - sideMass("L");
  if (!d) return 0;
  const t = Math.min(1, (Math.abs(d)-1)/Math.max(1, V.span-1));
  return Math.sign(d) * (V.tilt0 + (V.tilt1-V.tilt0)*t);
}

/* 사슬 — 고리를 하나씩 그린다. 줄기를 따라 눕혀 꿴다 */
function chainLinks(x1, y1, x2, y2){
  const dx = x2-x1, dy = y2-y1, len = Math.hypot(dx, dy);
  const deg = Math.atan2(dy, dx) * 180/Math.PI - 90;
  const n = Math.max(2, Math.round(len / V.link));
  let out = "";
  for (let i = 0; i < n; i++){
    const t = (i + 0.5) / n, x = x1 + dx*t, y = y1 + dy*t;
    const rx = i % 2 ? V.link*0.34 : V.link*0.19;
    out += `<ellipse cx="0" cy="0" rx="${rx.toFixed(2)}" ry="${(V.link*0.46).toFixed(2)}"
      fill="none" stroke="${CAST}" stroke-width="1.6"
      transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${deg.toFixed(1)})"/>`;
  }
  return out;
}

function boardSVG(){
  const W = 900, pivot = { x: W/2, y: 92 };
  const H = pivot.y + V.col + 54;
  const a = tiltDeg() * Math.PI/180, L = V.beam/2;
  const ring = s => ({ x: pivot.x + (s==="L"?-1:1)*L*Math.cos(a),
                       y: pivot.y + (s==="L"?-1:1)*L*Math.sin(a) });

  /* 기둥 — 사람이 준 그림대로 넷으로 나눠 그린다. 통째로 먹빛이다
       꼭대기 촛대 · 구슬 셋 · 몸통(아래로 갈수록 조금 굵다) · 벌어지는 받침 */
  const cx = pivot.x, py = pivot.y, F = V.finial;
  const st = V.shaft/2, sb = V.shaft/2 + 5, bw = V.base/2;
  const footH = 32, plinth = 13, bottom = py + V.col;
  const bodyBot = bottom - plinth - footH;
  const column =
    /* 뾰족한 꼭대기 */
    `<path d="M ${cx} ${py-F} q 7 12 6 22 l -12 0 q -1 -10 6 -22 z" fill="${CAST}"/>`
    /* 구슬 셋 — 아래로 갈수록 굵다 */
  + [[38, 9, 7], [24, 11, 7.5], [10, 12.5, 8]]
      .map(([up, rx, ry]) => `<ellipse cx="${cx}" cy="${py-up}" rx="${rx}" ry="${ry}" fill="${CAST}"/>`).join("")
    /* 구슬과 몸통을 잇는 목 */
  + `<rect x="${cx-7}" y="${py-46}" width="14" height="${46}" fill="${CAST}"/>`
    /* 몸통 */
  + `<path d="M ${cx-st} ${py} L ${cx+st} ${py} L ${cx+sb} ${bodyBot} L ${cx-sb} ${bodyBot} z" fill="${CAST}"/>`
    /* 받침 — 안으로 패며 벌어졌다가 넓적한 돌로 앉는다 */
  + `<path d="M ${cx-sb} ${bodyBot}
       Q ${cx-sb-3} ${bodyBot+footH*0.62} ${cx-bw} ${bodyBot+footH}
       L ${cx-bw} ${bottom-4} Q ${cx-bw} ${bottom} ${cx-bw+4} ${bottom}
       L ${cx+bw-4} ${bottom} Q ${cx+bw} ${bottom} ${cx+bw} ${bottom-4}
       L ${cx+bw} ${bodyBot+footH}
       Q ${cx+sb+3} ${bodyBot+footH*0.62} ${cx+sb} ${bodyBot} z" fill="${CAST}"/>`;

  /* 들보 — 가운데가 두껍고 끝으로 갈수록 얇다. 끝에 고리가 달렸다 */
  const beam =
    `<g class="beam" transform="rotate(${tiltDeg()} ${pivot.x} ${pivot.y})">
       <path d="M ${pivot.x-L} ${pivot.y} q ${L*0.5} -10 ${L} -12
                q ${L*0.5} 2 ${L} 12 q ${-L*0.5} 10 ${-L} 12
                q ${-L*0.5} -2 ${-L} -12 z" fill="${CAST}"/>
       <circle cx="${pivot.x-L}" cy="${pivot.y}" r="9" fill="none" stroke="${CAST}" stroke-width="5"/>
       <circle cx="${pivot.x+L}" cy="${pivot.y}" r="9" fill="none" stroke="${CAST}" stroke-width="5"/>
     </g>`;

  /* 접시 한 벌 — 고리에서 사슬로 매달린다. 접시는 **늘 수평**이다 */
  /* 화살표가 설 자리 — 저울을 다 그린 뒤 맨 위에 얹는다 */
  const arrowAt = s => { const r = ring(s);
    return [r.x, r.y + V.chain - V.wtH - V.arrow*0.85]; };
  function sling(s){
    const r = ring(s), pw = V.pan, top = r.y + V.chain;
    const chains = [-0.78, 0, 0.78]
      .map(f => chainLinks(r.x, r.y+7, r.x + pw*f, top)).join("");
    const load = ALL().filter(k => S.at[k] === s);
    const gap = 5, tot = load.length*V.wtW + (load.length-1)*gap;
    const wts = load.map((k,i) => {
      const x = r.x - tot/2 + i*(V.wtW+gap), y = top - V.wtH;
      const mine = canTouch(k);
      return `<g transform="translate(${x} ${y})"><g class="${anim.k===k?anim.how:""}">`
           + weightSVG(k, (mine?"":"locked ") + (S.sel===k?"sel":"")) + `</g></g>`;
    }).join("");
    return `<g class="sling" data-side="${s}">${chains}
      <path d="M ${r.x-pw} ${top} a ${pw} ${V.panD} 0 0 0 ${pw*2} 0 z" fill="${CAST}"/>
      <rect x="${r.x-pw-2}" y="${top-V.panT}" width="${pw*2+4}" height="${V.panT}"
            rx="${V.panT/2}" fill="${CAST}"/>
      ${wts}</g>`;
  }
  /* 저울이 서는 자리는 **흰 사각형**이다 */
  return `<svg class="scale" viewBox="0 0 ${W} ${H}" height="${H}">`
       + `<rect width="${W}" height="${H}" rx="10" fill="${SHEET}"/>`
       + column + sling("L") + sling("R") + beam
       + goArrow("L", ...arrowAt("L")) + goArrow("R", ...arrowAt("R"))
       + `</svg>`;
}

/* ══ 정답 칸 ═════════════════════════════════════════════════════ */
const slotBox = () => { const b = glyphBox(), pad = 14;
  return { w: b.w + pad*2, h: b.h + pad*2 }; };
const cellH = () => V.slotW + 2;      /* 정사각형 + 칸막이 두 자리 */
function cellSVG(n){
  const b = slotBox(), g = glyph(n, CAST), h = cellH();  /* 흰 칸이라 먹빛이다 */
  return `<div class="cell" style="height:${h}px">
    <svg width="${V.slotW}" height="${h-2}" viewBox="0 0 ${b.w} ${b.h}">
      <g transform="translate(${b.w/2-g.w/2} ${b.h/2-g.h/2})">${g.body}</g></svg></div>`;
}
/* 지금 수를 가운데 두고 앞뒤 한 칸씩 더 얹는다. 띠를 한 칸 올려 둬야
   가운데가 들창에 든다 — 넘길 때는 이 자리를 한 칸 더 밀면 된다 */
function slotHTML(i){
  const h = cellH(), v = S.slot[i];
  const cells = [-1,0,1].map(d => cellSVG((v+d+MAX+1) % (MAX+1))).join("");
  return `<div class="win" style="width:${V.slotW}px;height:${h}px">
    <div class="strip" id="strip${i}" style="transform:translateY(${-h}px)">${cells}</div></div>`;
}
function answersHTML(){
  /* 그릇 = 슬롯. 글자 대신 **줄 두 개**로 같음표를 그린다 */
  const e = V.eq;
  const eq = `<svg width="${e}" height="${e*0.62}" viewBox="0 0 34 21">
      <rect x="1" y="3" width="32" height="5" rx="2.5" fill="${CAST}"/>
      <rect x="1" y="13" width="32" height="5" rx="2.5" fill="${CAST}"/></svg>`;
  const cup = `<img src="${CUPS[S.cup]}" alt="" style="height:${V.cupH}px">`;
  /* 오르내림은 ys.css 의 세모 버튼 — 방향이 뜻의 일부인 자리다 */
  const triBtn = (i, d) =>
    `<button class="ys-tri${d<0?" down":""}" data-slot="${i}" data-d="${d}"
       style="width:44px;height:30px">
       <svg viewBox="0 0 44 30"><polygon points="22,4 41,26 3,26"/></svg></button>`;
  return `<div class="ans">
      <div class="eqrow">${cup}${eq}${slotHTML(0)}</div>
      <div class="lift">${triBtn(0,1)}${triBtn(0,-1)}</div>
    </div>`;
}

];
function pfpSVG(i){
  return `<div class="pfp${i===S.me?" me":""}" style="width:${V.pfp}px;
    height:${V.pfp}px;background-image:url(${MUGS[i]})"></div>`;
}
function spacesHTML(){
  return Array.from({length:S.n}, (_, i) => {
    const mine = i === S.me;
    const load = ALL().filter(k => S.at[k] === "home" && ownerOf(k) === i);
    const w = Math.max(V.spaceW, load.length*(V.wtW+6)+16);
    const wts = load.map(k =>
      `<svg width="${V.wtW}" height="${V.wtH}">
         ${weightSVG(k, (canTouch(k)?"":"locked ") + (S.sel===k?"sel":""))}</svg>`).join("");
    const A = V.arrow;
    const go = (S.sel && canTouch(S.sel) && S.at[S.sel] !== "home"
                && ownerOf(S.sel) === i)
      ? `<svg class="go" data-go="home" width="${A}" height="${A}"
           viewBox="${-A/2} ${-A/2} ${A} ${A}" style="position:absolute;left:50%;
           top:${-A*0.72}px;transform:translateX(-50%)">
           <path d="${arrowPath(A)}" fill="var(--gold)"/></svg>` : "";
    return `<div class="me${mine?" mine":""}">
      <div class="space${mine?" mine":""}" data-i="${i}"
           style="width:${w}px;min-height:${V.wtH+18}px">${wts}${go}</div>
      ${pfpSVG(i)}</div>`;
  }).join("");
}

/* ══ 그린다 ══════════════════════════════════════════════════════ */
const anim = { k: null, how: "" };
function render(){
  readKnobs();
  $("board").innerHTML = boardSVG();
  $("answers").innerHTML = answersHTML();
  $("spaces").innerHTML = spacesHTML();
  const b = $("submit");
  const boss = S.god || S.me === 0;             /* 참말 게임에서는 대장만 누른다 */
  b.className = "ys-btn " + (boss ? S.verdict : "cool");
  b.disabled = !boss;
  anim.k = null; anim.how = "";
}

/* ══ 손가락 ══════════════════════════════════════════════════════ */
/* 슬롯을 한 칸 넘긴다. 수가 커지면 띠가 위로 올라간다 */
let spinning = false;
function spin(i, d){
  if (spinning) return;                         /* 흐르는 동안은 안 받는다 */
  spinning = true;
  const st = $("strip"+i), h = cellH();
  st.style.transition = `transform ${V.spin}ms cubic-bezier(.3,.9,.3,1)`;
  st.style.transform = `translateY(${-h*(1+d)}px)`;
  setTimeout(() => {
    S.slot[i] = (S.slot[i] + d + MAX + 1) % (MAX + 1);
    S.verdict = ""; spinning = false; render();
  }, V.spin);
}

function move(k, where){
  const from = S.at[k];
  if (from !== "home" && where === "home"){     /* 접시에서 내릴 때만 먼저 띄운다 */
    anim.k = k; anim.how = "rise"; render();
    setTimeout(() => { S.at[k] = where; S.sel = null; S.verdict = ""; render(); }, 360);
    return;
  }
  S.at[k] = where; S.sel = null; S.verdict = "";
  if (where !== "home"){ anim.k = k; anim.how = "drop"; }
  render();
}
document.addEventListener("click", e => {
  const go = e.target.closest(".go");
  if (go && S.sel){ move(S.sel, go.dataset.go); return; }
  const wt = e.target.closest(".wt");
  if (wt){
    const k = wt.dataset.k;
    if (!canTouch(k)) return;                    /* 제 추만 제가 옮긴다 */
    S.sel = S.sel === k ? null : k;
    render(); return;
  }
  const bt = e.target.closest("[data-slot]");
  if (bt){ spin(+bt.dataset.slot, +bt.dataset.d); return; }
});
$("submit").onclick = () => {
  const won = S.slot[0] === S.quiz[0];
  S.verdict = won ? "done" : "bad";
  render();
  if (!won) setTimeout(() => { reset(false); render(); }, 900);
};
$("n").onchange = () => { S.n = +$("n").value; fillMe(); reset(false); render(); };
$("me").onchange = () => { S.me = +$("me").value; S.sel = null; render(); };
$("god").onchange = () => { S.god = $("god").value === "1"; S.sel = null; render(); };
$("again").onclick = () => { reset(false); $("answer").textContent = ""; render(); };
$("peek").onclick = () => $("answer").textContent = S.quiz.join(" · ");
$("apply").onclick = () => {
  try { Object.assign(G, JSON.parse($("glyph").value)); render(); }
  catch (err){ $("glyph").value = "읽을 수 없는 JSON 이다 — " + err.message; }
};
$("dump").onclick = () => $("glyph").value = JSON.stringify(G, null, 2);
for (const el of document.querySelectorAll("input[type=range]")) el.oninput = render;
function fillMe(){
  $("me").innerHTML = Array.from({length:S.n}, (_,i) =>
    `<option value="${i}">${i===0?"대장":i+1}</option>`).join("");
  $("me").value = String(Math.min(S.me, S.n-1));
  S.me = +$("me").value;
}

/* ══ 검산 ════════════════════════════════════════════════════════ */
const chk = [];
const ok = (name, got, want) => chk.push([name,
  JSON.stringify(got) === JSON.stringify(want), got, want]);

ok("문제는 스무 가지다", POOL.length, 20);
ok("더해서 나오는 값은 문제에 안 쓴다", POOL.filter(n => SUMS.has(n)).length, 0);
ok("맞힐 것은 하나다", newQuiz().length, 1);
ok("문제는 늘 쓸 수 있는 값에서 나온다",
   Array.from({length:300}, () => POOL.includes(newQuiz()[0])).every(Boolean), true);
ok("모든 문제는 저울로 잴 수 있다",
   POOL.filter(w => {
     for (let m = 0; m < 81; m++){
       let v = 0;
       for (let i = 0, x = m; i < 4; i++, x = Math.floor(x/3)) v += (x%3 - 1) * UNITS[i];
       if (v === w) return false;
     }
     return true;
   }).length, 0);
for (const n of [2,3,4]){
  const trials = Array.from({length:200}, () => deal(n));
  ok(`${n}마리 — 저마다 추를 적어도 하나 든다`,
     trials.every(t => t.own.every(a => a.length)), true);
  ok(`${n}마리 — 퀴즈 추는 한 마리가 든다`,
     trials.every(t => t.quizOwner.length === 1
       && t.quizOwner[0] >= 0 && t.quizOwner[0] < n), true);
}
ok("추 하나뿐인 다람쥐가 있으면 그가 퀴즈 추를 든다",
   [2,3,4].every(n => Array.from({length:300}, () => deal(n))
     .every(t => t.own.some(a => a.length === 1)
       ? t.own[t.quizOwner[0]].length === 1 : true)), true);

reset(false); readKnobs();
S.quiz = [11]; S.at["u1"] = "R";
ok("차가 1 이면 최소 기울기만큼 기운다", Math.abs(tiltDeg()), V.tilt0);
S.at["u27"] = "L"; S.at["u9"] = "L"; S.at["u3"] = "L";
ok("많이 차이 나면 최대 기울기에서 멎는다", Math.abs(tiltDeg()), V.tilt1);
for (const k of ["u1","u3","u9","u27"]) S.at[k] = "home";
ok("아무것도 안 얹으면 수평이다", tiltDeg(), 0);
ok("0 은 빈 칸이다", glyph(0, CAST).body, "");
ok("추는 먹빛 실루엣이다", weightSVG("u1","").includes(`fill="${CAST}"`), true);
ok("저울이 선 자리는 흰 판이다", boardSVG().includes(`fill="${SHEET}"`), true);
/* 화살표는 맨 앞에 — 들보보다 뒤에 서면 가려진다 */
ok("화살표가 저울보다 앞에 선다",
   (S.sel = "u1", S.at["u1"] = "home",
    boardSVG().lastIndexOf("class=\"go\"") > boardSVG().indexOf("class=\"beam\"")), true);
S.sel = null;
ok("슬롯 한 칸은 정사각형이다", cellH() - 2, V.slotW);
ok("접시는 너비보다 한참 얕다", V.panD * 3 < V.pan, true);
/* 실험실은 열어 두되, 잠그면 남의 추는 안 집힌다 */
ok("다 만지기를 켜면 넷의 추를 다 집는다",
   (S.god = true, ALL().every(canTouch)), true);
ok("잠그면 제 추만 집힌다",
   (S.god = false, S.me = 0, ALL().filter(canTouch).every(k => ownerOf(k) === 0)), true);
S.god = true;
ok("화살표는 자루와 머리가 달렸다 — 꼭짓점 일곱", arrowPath(40).split(" L ").length, 7);
/* 움직이는 g 에는 제 transform 이 없어야 한다 — 있으면 CSS 가 그것을
   덮어쓰면서 추가 옆으로 샌다 */
ok("올림 내림은 곧게 위아래로만 간다",
   (anim.k = "u1", anim.how = "drop", S.at["u1"] = "L",
    /<g class="drop">/.test(boardSVG()) && !/<g transform="[^"]*" class="drop"/.test(boardSVG())),
   true);
anim.k = null; anim.how = ""; S.at["u1"] = "home";
ok("위 세모가 수를 키운다", /data-d="1"[\s\S]*data-d="-1"/.test(answersHTML()), true);
ok("아래로 가는 세모만 뒤집는다", (answersHTML().match(/ys-tri down/g) || []).length, 1);
ok("정답 칸은 한 줄이다", (answersHTML().match(/class="ans"/g) || []).length, 1);
ok("슬롯은 앞뒤 한 칸씩 거느린다", (slotHTML(0).match(/class="cell"/g) || []).length, 3);
ok("칸마다 가로 칸막이를 두른다", /class="cell"/.test(cellSVG(7)), true);
ok("그릇 마흔을 박아 두었다",
   CUPS.length === 40 && CUPS.every(c => c.startsWith("data:image/png;base64,")), true);
ok("퀴즈 추는 그릇 그림 그대로다", /<image href="data:image\/png/.test(weightSVG("q0","")), true);
ok("물음표를 쓰지 않는다", /[?]</.test(weightSVG("q0","") + answersHTML()), false);
ok("정답 칸은 그릇 · 같음표 · 슬롯 셋이다",
   (answersHTML().match(/<img |<rect x="1" y="3"|class="win"/g) || []).length, 3);
ok("다람쥐 얼굴 넷을 박아 두었다",
   MUGS.length === 4 && MUGS.every(m => m.startsWith("data:image/png;base64,")), true);

$("chk").innerHTML = chk.map(([n,p,got,want]) =>
  `<div class="${p?"pass":"fail"}">${p?"✔":"✘"} ${n}`
  + (p ? "" : ` — ${JSON.stringify(got)} ≠ ${JSON.stringify(want)}`) + `</div>`).join("")
  + `<div class="hint" style="margin-top:6px">${chk.filter(c=>c[1]).length} / ${chk.length}</div>`;

fillMe(); reset(false); render();
</script>
</body>
</html>
