<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>도토리 — 삼진법 표기 고르기</title>
<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css");

  /* 이 페이지는 **혼자 선다.** 깃헙 페이지스에 한 장으로 올라간다 —
     그래서 ys.css 를 걸지 않고 쓰는 값만 여기 베껴 둔다 */
  :root{
    --ink-900:#12100d; --ink-800:#1b1815; --ink-700:#221e1a;
    --line:#332e28;    --line-2:#4a433a;
    --text:#ece7de;    --dim:#8b8275;
    --gold:#e8b339;    --gold-lit:#ffd873; --green:#3fb950; --red:#e5534b;
    --t-xs:11.5px; --t-sm:12.5px; --t-md:14.5px; --t-lg:16px; --t-2xl:25px;
    --s-2:8px; --s-3:12px; --s-4:16px; --s-6:24px;
    --r-sm:5px;
    --font:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",
      "맑은 고딕",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{margin:0;background:var(--ink-900);color:var(--text);
    font:var(--t-md)/1.6 var(--font);-webkit-tap-highlight-color:transparent;
    display:grid;grid-template-columns:1fr 340px;min-height:100vh}
  @media (max-width:1040px){body{grid-template-columns:1fr}}

  .stage{padding:var(--s-6);display:flex;flex-direction:column;gap:var(--s-6)}
  .panel{border-left:1px solid var(--line);background:var(--ink-800);
    padding:var(--s-4);display:flex;flex-direction:column;gap:var(--s-3);
    overflow:auto;max-height:100vh;position:sticky;top:0}
  @media (max-width:1040px){.panel{position:static;max-height:none;
    border-left:0;border-top:1px solid var(--line)}}

  h2{font-size:var(--t-sm);color:var(--dim);margin:0;letter-spacing:.08em;
    text-transform:uppercase;font-weight:600}
  .row{display:flex;align-items:center;gap:var(--s-2)}
  .row label{flex:0 0 96px;font-size:var(--t-sm);color:var(--dim)}
  .row input[type=range]{flex:1;accent-color:var(--gold)}
  .row output{flex:0 0 42px;text-align:right;font-size:var(--t-sm);
    font-variant-numeric:tabular-nums}
  select,button,input[type=number]{background:var(--ink-700);color:var(--text);
    border:1px solid var(--line-2);border-radius:var(--r-sm);
    padding:6px 10px;font:var(--t-sm) var(--font)}
  button{cursor:pointer}
  button:hover{border-color:var(--gold)}
  textarea{width:100%;height:150px;background:var(--ink-900);color:var(--dim);
    border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--s-2);
    font:11px/1.5 ui-monospace,Consolas,monospace;resize:vertical}

  /* 크게 보는 칸 */
  .big{display:flex;align-items:center;gap:var(--s-6);flex-wrap:wrap}
  .plate{background:var(--ink-800);border:1px solid var(--line);
    border-radius:12px;padding:var(--s-6);display:flex;align-items:center;
    justify-content:center;min-width:220px;min-height:220px}
  .num{font-size:var(--t-2xl);font-variant-numeric:tabular-nums}
  .hint{font-size:var(--t-sm);color:var(--dim)}

  /* 추 안에 넣어 본 모습 — 추는 옆에서 본 사다리꼴 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));
    gap:var(--s-3)}
  .cell{background:var(--ink-800);border:1px solid var(--line);
    border-radius:8px;padding:var(--s-2);display:flex;flex-direction:column;
    align-items:center;gap:4px;cursor:pointer}
  .cell:hover{border-color:var(--gold)}
  .cell.on{border-color:var(--gold-lit)}
  .cell .cap{font-size:var(--t-xs);color:var(--dim);
    font-variant-numeric:tabular-nums}
  .cell .box{height:74px;display:flex;align-items:center}

  /* 스스로 하는 검산 */
  .chk{font-size:var(--t-xs);line-height:1.8}
  .chk b{font-weight:600}
  .pass{color:var(--green)} .fail{color:var(--red)}
</style>
</head>
<body>

<div class="stage">
  <div>
    <h2>삼진법 표기 — 고르는 판</h2>
    <p class="hint">
      1·3·9·27 의 자리를 차례로 <b>작은 원 · 가로 줄 · 물결 · 달팽이</b> 로
      적는다. 낮은 자리가 위다. 1 의 자리와 27 의 자리는 가로로 늘어서고,
      3 과 9 의 자리는 아래로 포갠다. 0 은 빈 칸이다.
      슬롯 칸의 키는 <b>가장 큰 글리프(25·26 — 다섯 줄)</b> 에 맞춰 못 박는다.
    </p>
  </div>

  <div class="big">
    <div class="plate" id="plate"></div>
    <div class="plate" id="plateW" title="추 안에 넣어 본 모습"></div>
    <div class="plate" id="plateS" title="슬롯 한 칸에 넣어 본 모습"></div>
    <div>
      <div class="num" id="bigNum">23</div>
      <div class="hint" id="bigTxt"></div>
      <div class="row" style="margin-top:var(--s-3)">
        <input type="range" id="pick" min="0" max="40" value="23">
        <output id="pickO">23</output>
      </div>
    </div>
  </div>

  <div>
    <h2>0 부터 40 까지</h2>
    <div class="grid" id="all"></div>
  </div>
</div>

<div class="panel">
  <h2>생김새</h2>
  <div id="knobs"></div>

  <h2>칠</h2>
  <div class="row">
    <label>27 의 자리</label>
    <select id="big">
      <option value="snail">달팽이</option>
      <option value="tri">역삼각형</option>
    </select>
  </div>
  <div class="row">
    <label>빛깔</label>
    <select id="ink">
      <option value="#ece7de">흰 것</option>
      <option value="#e8b339">금</option>
      <option value="#12100d">검정 (밝은 추)</option>
    </select>
  </div>
  <div class="row">
    <label>원 속</label>
    <select id="fill"><option value="0">비운다</option><option value="1">채운다</option></select>
  </div>
  <div class="row">
    <label>선 끝</label>
    <select id="cap">
      <option value="round">둥글게</option>
      <option value="butt">자른 채</option>
      <option value="square">네모지게</option>
    </select>
  </div>

  <h2>내보내기</h2>
  <div class="row">
    <button id="dump">값 JSON</button>
    <button id="one">이 수의 SVG</button>
    <button id="reset">되돌린다</button>
  </div>
  <textarea id="out" readonly></textarea>

  <h2>검산</h2>
  <div class="chk" id="chk"></div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);

/* ── 수를 자리로 쪼갠다 ─────────────────────────────────────────
   낮은 자리부터 [1, 3, 9, 27]. 0..40 만 적는다 — 41 부터는 27 의 자리가
   둘이 되어 「^~-*」 를 넘는다 */
const MAX = 40;
function tri(n){
  const d = [];
  for (let i = 0, m = n; i < 4; i++, m = Math.floor(m / 3)) d.push(m % 3);
  return d;                                   // [1의, 3의, 9의, 27의]
}
const SIGN = ["*", "-", "~", "^"];
function text(n){                              // 높은 자리부터 가로로 적는다
  const d = tri(n);
  let s = "";
  for (let i = 3; i >= 0; i--) s += SIGN[i].repeat(d[i]);
  return s || "(빈 칸)";
}

/* ── 손잡이 ──────────────────────────────────────────────────── */
/* [키, 이름, 아래, 위, 처음, 단위, 나누는 수] — 나누는 수로 소수점을 낸다 */
const KNOB = [
  ["w",     "줄 길이",     16,  90, 38, "px"],
  ["t",     "선 굵기",      1,  12,  3, "px"],
  ["gap",   "줄 사이",      0,  26, 5, "px"],
  ["dotD",  "원 지름",      4,  34, 14, "px"],
  ["dotG",  "원 사이",      0,  26,  9, "px"],
  ["waveN", "물결 굽이",    1,   5,  3, "번"],
  ["waveA", "물결 높이",    2,  18,  4, "px"],
  ["snailD","달팽이 지름",  8,  52, 26, "px"],
  ["turns", "달팽이 감기",  4,  18, 8, "바퀴", 4],
  ["triW",  "세모 폭",      8,  46, 24, "px"],
  ["triH",  "세모 키",      4,  32, 14, "px"],
  ["zoom",  "크게 보기",    1,   8,  4, "배"],
];
const V = {};
$("knobs").innerHTML = KNOB.map(([k, name, lo, hi, def, unit, div]) =>
  `<div class="row"><label>${name}</label>
   <input type="range" id="k_${k}" min="${lo}" max="${hi}" value="${def}">
   <output id="o_${k}">${def / (div || 1)}${unit}</output></div>`).join("");

function readKnobs(){
  for (const [k, , , , , unit, div] of KNOB){
    V[k] = +$("k_" + k).value / (div || 1);
    $("o_" + k).textContent = V[k] + unit;
  }
  V.ink   = $("ink").value;
  V.fill  = $("fill").value === "1";
  V.cap   = $("cap").value;
  V.big   = $("big").value;              // 27 의 자리를 무엇으로 그리나
}

/* ── 글리프를 그린다 ─────────────────────────────────────────────
   한 줄씩 쌓는다. 자리마다 줄 수가 다르다 —
   1 의 자리는 원을 옆으로, 3·9 는 줄을 아래로, 27 은 세모를 옆으로 */
function rowsOf(n){
  const d = tri(n), out = [];
  if (d[0]) out.push({ k: "dot",  n: d[0] });
  for (let i = 0; i < d[1]; i++) out.push({ k: "bar" });
  for (let i = 0; i < d[2]; i++) out.push({ k: "wave" });
  if (d[3]) out.push({ k: "tri",  n: d[3] });
  return out;
}
const bigW = () => V.big === "snail" ? V.snailD : V.triW;
const bigH = () => V.big === "snail" ? V.snailD : V.triH;
const rowH = r => r.k === "dot"  ? V.dotD
                : r.k === "bar"  ? V.t
                : r.k === "wave" ? V.waveA * 2 + V.t
                : /* tri */        bigH();
const rowW = r => r.k === "dot" ? r.n * V.dotD + (r.n - 1) * V.dotG
                : r.k === "tri" ? r.n * bigW() + (r.n - 1) * V.dotG
                : V.w;

/* 달팽이 — 가운데서 밖으로 감아 나가는 줄. @ 처럼 생겼다 */
function snail(cx, cy, R, turns){
  const end = turns * 2 * Math.PI, n = Math.ceil(turns * 48);
  let d = "";
  for (let i = 0; i <= n; i++){
    const th = end * i / n, r = (R - V.t / 2) * th / end;
    d += (i ? " L " : "M ") + (cx + r * Math.cos(th)).toFixed(2)
       + " " + (cy + r * Math.sin(th)).toFixed(2);
  }
  return d;
}

function draw(r, cx, y){            // y 는 그 줄의 꼭대기
  const h = rowH(r), s = `stroke="${V.ink}" stroke-width="${V.t}" fill="none" stroke-linecap="${V.cap}"`;
  if (r.k === "dot"){
    const g = [], w = rowW(r), R = V.dotD / 2;
    for (let i = 0; i < r.n; i++){
      const x = cx - w / 2 + R + i * (V.dotD + V.dotG);
      g.push(V.fill
        ? `<circle cx="${x}" cy="${y + R}" r="${R}" fill="${V.ink}"/>`
        : `<circle cx="${x}" cy="${y + R}" r="${R - V.t / 2}" ${s}/>`);
    }
    return g.join("");
  }
  if (r.k === "bar"){
    const y0 = y + V.t / 2;
    return `<line x1="${cx - V.w / 2}" y1="${y0}" x2="${cx + V.w / 2}" y2="${y0}" ${s}/>`;
  }
  if (r.k === "wave"){
    const half = V.w / (2 * V.waveN), y0 = y + h / 2;
    let p = `M ${cx - V.w / 2} ${y0}`;
    for (let i = 0; i < V.waveN * 2; i++)
      p += ` q ${half / 2} ${(i % 2 ? 2 : -2) * V.waveA} ${half} 0`;
    return `<path d="${p}" ${s}/>`;
  }
  const g = [], w = rowW(r), bw = bigW();     // 27 의 자리 — 달팽이 또는 세모
  for (let i = 0; i < r.n; i++){
    const x = cx - w / 2 + i * (bw + V.dotG);
    g.push(V.big === "snail"
      ? `<path d="${snail(x + bw / 2, y + bw / 2, bw / 2, V.turns)}" ${s}/>`
      : `<polygon points="${x},${y} ${x + bw},${y} ${x + bw / 2},${y + V.triH}" fill="${V.ink}"/>`);
  }
  return g.join("");
}

/* 수 하나를 SVG 한 장으로. pad 만큼 둘레를 비운다 */
function svg(n, zoom){
  const rows = rowsOf(n), pad = 4;
  if (!rows.length){                       // 0 — 빈 칸
    const w = V.w + pad * 2, h = V.dotD + pad * 2;
    return `<svg viewBox="0 0 ${w} ${h}" width="${w * zoom}" height="${h * zoom}"></svg>`;
  }
  const inW = Math.max(...rows.map(rowW));
  const inH = rows.reduce((a, r) => a + rowH(r), 0) + (rows.length - 1) * V.gap;
  const w = inW + pad * 2, h = inH + pad * 2, cx = w / 2;
  let y = pad, body = "";
  for (const r of rows){ body += draw(r, cx, y); y += rowH(r) + V.gap; }
  return `<svg viewBox="0 0 ${w} ${h}" width="${(w * zoom).toFixed(1)}" `
       + `height="${(h * zoom).toFixed(1)}" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
}

/* 추 안에 넣어 본 모습 — 옆에서 본 사다리꼴 */
function weight(n){
  const g = svg(n, 1), m = /viewBox="0 0 ([\d.]+) ([\d.]+)"/.exec(g);
  const gw = +m[1], gh = +m[2];
  const W = Math.max(gw + 34, 76), H = Math.max(gh + 30, 70), lip = W * 0.17;
  const z = Math.min(3.4, 190 / W, 190 / H);
  return `<svg viewBox="0 0 ${W} ${H}" width="${(W * z).toFixed(1)}" height="${(H * z).toFixed(1)}">`
       + `<polygon points="${lip},6 ${W - lip},6 ${W - 3},${H - 6} ${3},${H - 6}" `
       + `fill="#2a241c" stroke="${V.ink === "#12100d" ? "#8b8275" : "var(--line-2)"}" stroke-width="1.5"/>`
       + `<g transform="translate(${(W - gw) / 2} ${(H - gh) / 2})">${g.replace(/^<svg[^>]*>|<\/svg>$/g, "")}</g>`
       + `</svg>`;
}

/* 슬롯 한 칸 — 키는 **가장 큰 글리프에 맞춰 못 박는다.** 수가 바뀌어도
   칸은 안 흔들리고 글리프만 가운데 선다 */
function slotBox(){
  let w = 0, h = 0;
  for (let n = 0; n <= MAX; n++){
    const rows = rowsOf(n);
    if (!rows.length) continue;
    w = Math.max(w, ...rows.map(rowW));
    h = Math.max(h, rows.reduce((a, r) => a + rowH(r), 0) + (rows.length - 1) * V.gap);
  }
  return { w, h };
}
function slot(n){
  const { w: gw0, h: gh0 } = slotBox();
  const W = gw0 + 26, H = gh0 + 22;
  const g = svg(n, 1), m = /viewBox="0 0 ([\d.]+) ([\d.]+)"/.exec(g);
  const gw = +m[1], gh = +m[2], z = Math.min(2.8, 200 / W, 240 / H);
  return `<svg viewBox="0 0 ${W} ${H}" width="${(W * z).toFixed(1)}" height="${(H * z).toFixed(1)}">`
       + `<rect x="1" y="1" width="${W - 2}" height="${H - 2}" rx="6" `
       + `fill="#0b0a08" stroke="#4a433a" stroke-width="1.5"/>`
       + `<g transform="translate(${(W - gw) / 2} ${(H - gh) / 2})">${g.replace(/^<svg[^>]*>|<\/svg>$/g, "")}</g>`
       + `</svg>`;
}

/* ── 다시 그린다 ─────────────────────────────────────────────── */
function render(){
  readKnobs();
  const n = +$("pick").value;
  $("pickO").textContent = n;
  $("bigNum").textContent = n;
  $("bigTxt").textContent = text(n) + "   ·   " + tri(n).join(" ") + " (1·3·9·27 의 자리)";
  $("plate").innerHTML  = svg(n, V.zoom);
  $("plateW").innerHTML = weight(n);
  $("plateS").innerHTML = slot(n);
  $("all").innerHTML = Array.from({ length: MAX + 1 }, (_, i) =>
    `<div class="cell${i === n ? " on" : ""}" data-n="${i}">
       <div class="box">${svg(i, 1.1)}</div><div class="cap">${i}</div></div>`).join("");
}
$("all").onclick = e => {
  const c = e.target.closest(".cell");
  if (c){ $("pick").value = c.dataset.n; render(); }
};
for (const el of document.querySelectorAll("input,select")) el.oninput = render;
$("reset").onclick = () => {
  for (const [k, , , , def] of KNOB) $("k_" + k).value = def;
  render();
};
$("dump").onclick = () => {
  readKnobs();
  const { zoom, ...keep } = V;
  $("out").value = JSON.stringify(keep, null, 2);
};
$("one").onclick = () => { $("out").value = svg(+$("pick").value, 1); };

/* ── 검산 ───────────────────────────────────────────────────── */
const chk = [];
const ok = (name, got, want) => chk.push([name,
  JSON.stringify(got) === JSON.stringify(want), got, want]);

ok("0 은 빈 칸이다", rowsOf(0).length, 0);
ok("1 은 원 하나", text(1), "*");
ok("2 는 원 둘", text(2), "**");
ok("4 는 줄 하나에 원 하나", text(4), "-*");
ok("8 은 줄 둘에 원 둘", text(8), "--**");
ok("23 은 물결 둘·줄 하나·원 둘", text(23), "~~-**");
ok("23 을 줄로 쌓으면 넷", rowsOf(23).map(r => r.k + (r.n || "")),
   ["dot2", "bar", "wave", "wave"]);
ok("40 이 끝이다", text(MAX), "^~-*");
ok("41 은 27 의 자리가 둘이 된다", text(41), "^^~~--**");
ok("쪼갠 것을 도로 더하면 제 수다",
   Array.from({ length: MAX + 1 }, (_, n) =>
     tri(n).reduce((a, d, i) => a + d * 3 ** i, 0) === n).every(Boolean), true);
ok("0..40 의 생김새가 서로 다르다",
   new Set(Array.from({ length: MAX + 1 }, (_, n) => text(n))).size, MAX + 1);
ok("낮은 자리가 위에 온다",
   rowsOf(40).map(r => r.k), ["dot", "bar", "wave", "tri"]);
ok("0..40 에서 가장 긴 것은 다섯 줄이다 (25 · 26)",
   Math.max(...Array.from({ length: MAX + 1 }, (_, n) => rowsOf(n).length)), 5);

$("chk").innerHTML = chk.map(([n, p, got, want]) =>
  `<div class="${p ? "pass" : "fail"}">${p ? "✔" : "✘"} <b>${n}</b>`
  + (p ? "" : ` — ${JSON.stringify(got)} ≠ ${JSON.stringify(want)}`) + `</div>`).join("")
  + `<div class="hint" style="margin-top:6px">${chk.filter(c => c[1]).length} / ${chk.length}</div>`;

render();
</script>
</body>
</html>
